<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>코스튬 방향·모션 확인</title>
<style>body{margin:0;background:#12202b;color:#f7e5b5;font:16px system-ui}main{max-width:900px;margin:auto;padding:16px}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,button{font:inherit;padding:10px;border:1px solid #9b854e;border-radius:8px;background:#203445;color:inherit}button[aria-pressed=true]{background:#765424}canvas{width:100%;height:auto;background:#23313b;border-radius:14px;margin-top:12px}p{color:#b7c7ce}</style>
<main><h1>코스튬 방향·모션</h1><header><select id="class" aria-label="코스튬"></select><button data-mode="idle" aria-pressed="false">대기</button><button data-mode="walk" aria-pressed="true">이동</button><button data-mode="attack" aria-pressed="false">공격</button></header><p id="status">모션 불러오는 중…</p><canvas width="900" height="540" aria-label="코스튬의 8방향 모습"></canvas><p>같은 캐릭터의 앞·옆·뒤 방향과 걸음·공격 자세를 표시합니다.</p></main>
<script type="module">
import {TowerRenderer,image,prepareCombatArt} from './tower-renderer.mjs?v=fifth-impact-121';
import {COSTUMES} from './costumes.mjs?v=costume-motion-111';
const select=document.querySelector('select'),canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),status=document.querySelector('#status');
select.innerHTML=COSTUMES.map(c=>`<option value="${c.classId}">${c.name}</option>`).join('');
let mode='walk';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
const r=Object.create(TowerRenderer.prototype);r.g=g;r.mobileActors={matches:false};
try{await prepareCombatArt(COSTUMES.map(c=>c.classId),'golem',COSTUMES.map(c=>c.id));await Promise.all(COSTUMES.map(c=>image(c.atlas).decode()));status.textContent='6직업 방향별 모션 로딩 완료';document.documentElement.dataset.ready='true';}catch(e){status.textContent=e.message;document.documentElement.dataset.ready='error';}
const labels=['→ 오른쪽','↘ 오른쪽 아래','↓ 아래','↙ 왼쪽 아래','← 왼쪽','↖ 왼쪽 위','↑ 위','↗ 오른쪽 위'];
function draw(time){const c=COSTUMES.find(c=>c.classId===select.value);g.clearRect(0,0,900,540);for(let d=0;d<8;d++){const x=d%4*225+112.5,y=Math.floor(d/4)*270+225;g.fillStyle='#111d2780';g.beginPath();g.ellipse(x,y,48,12,0,0,Math.PI*2);g.fill();r.actor(c.classId,d,mode==='walk',mode==='attack',(time%1100)/1100,time/95,x,y,1,c.id);g.fillStyle='#f7e5b5';g.font='18px system-ui';g.textAlign='center';g.fillText(labels[d],x,y+30);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
