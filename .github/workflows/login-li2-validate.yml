name: Validate login recovery LI2
on:
  push:
    branches: [diagnose/login-LI2-20260910]
    paths: [.github/workflows/login-li2-validate.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested login-only changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def patch(name,before_sha,after_sha,changes):
              p=Path(name);b=p.read_bytes();assert blob(b)==before_sha,'Source changed: '+name
              t=b.decode('utf-8')
              for old,new in changes:
                  assert t.count(old)==1,'Ambiguous anchor: '+name
                  t=t.replace(old,new,1)
              b=t.encode();assert blob(b)==after_sha,'Not locally tested output: '+name
              p.write_bytes(b)
