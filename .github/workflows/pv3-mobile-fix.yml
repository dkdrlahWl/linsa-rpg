      - name: Syntax and core regressions
        run: |
          node --check premium-ui-v2.js
          node --check remodel.js
          node --test test/economy.test.mjs test/tower-hp-restored.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs test/login-inventory.test.mjs test/login-recovery.test.mjs
      - name: Build isolated mobile browser acceptance from existing synthetic fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('test/auction-mobile-ui.test.mjs').read_text()
          cut=src.index('try{\n const context=await browser.newContext')
          s=src[:cut]
          s=s.replace('../test-output/auction-AU2/','../test-output/PV3/')
          s+=r'''try{
           const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
           await context.addInitScript(({user})=>localStorage.setItem('ringu.supabase.v1.ekgihnyojihpearcudtd.supabase.co',JSON.stringify({access_token:'synthetic-pv3',refresh_token:'synthetic-pv3',expires_at:Date.now()/1000+3600,user:{id:user.id,email:'pv3@test.invalid',user_metadata:{username:user.username}}})),{user});
           await context.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1')return route.continue();if(u.hostname==='ekgihnyojihpearcudtd.supabase.co'){queue=queue.then(async()=>{try{await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(await remote(route.request()))});}catch(e){await route.fulfill({status:400,contentType:'application/json',body:JSON.stringify({error:e.message,message:e.message})});}});return queue;}unexpected.push(u.origin);return route.abort();});
           const page=await context.newPage();activePage=page;page.on('pageerror',e=>errors.push(e.message));
           await page.goto(base,{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.RinguPremium&&window.RinguPortrait&&RinguSession.active&&document.querySelector('.rm-bottom-nav[data-pv2]'));
           await page.waitForFunction(()=>document.body.dataset.page==='home'&&document.querySelector('#pvHome')&&!document.querySelector('#pvHome').hidden);
           const navLabels=await page.locator('.rm-bottom-nav button strong').allTextContents();assert.deepEqual(navLabels.slice(0,5),['메인','사냥','캐릭터','소환','메뉴']);
           assert.equal(await page.locator('.rm-bottom-nav .pv-icon').count(),5,'PV SVG icons survive legacy observer');
           const hud=await page.evaluate(()=>{const top=document.querySelector('.topbar'),stats=document.querySelector('#rmCurrencyStats')||document.querySelector('.topbar .stats'),children=[...stats.children].slice(0,6),b=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,sw:e.scrollWidth,cw:e.clientWidth}};return{top:b(top),stats:b(stats),items:children.map(b),appTop:document.querySelector('main.app').getBoundingClientRect().top,labels:children.map(e=>e.querySelector('.stat-label')?.textContent),values:children.map(e=>e.querySelector('.stat-value')?.textContent)};});
           assert.equal(hud.items.length,6);assert.ok(Math.abs(hud.items[0].y-hud.items[1].y)<2&&Math.abs(hud.items[1].y-hud.items[2].y)<2,JSON.stringify(hud));assert.ok(Math.abs(hud.items[3].y-hud.items[4].y)<2&&Math.abs(hud.items[4].y-hud.items[5].y)<2);assert.ok(hud.items[3].y>hud.items[0].y+20);for(const it of hud.items){assert.ok(it.x>=hud.stats.x-1&&it.right<=hud.stats.right+1,JSON.stringify({hud,it}));assert.ok(it.sw<=it.cw+1,JSON.stringify(it));}assert.ok(hud.appTop>=hud.top.bottom-1,JSON.stringify(hud));
           await page.locator('.rm-bottom-nav button[data-target="hunt"]').click();await page.waitForFunction(()=>document.body.dataset.page==='hunt');assert.ok(await page.locator('.battle-panel').isVisible());assert.ok(await page.locator('#pvHome').isHidden());
           await page.locator('.rm-bottom-nav button[data-target="home"]').click();await page.waitForFunction(()=>document.body.dataset.page==='home');assert.ok(await page.locator('#pvHome').isVisible());
           await page.locator('.rm-bottom-nav button[data-target="menu"]').click();await page.waitForFunction(()=>document.body.dataset.page==='menu');const menu=await page.evaluate(()=>{const top=document.querySelector('.topbar').getBoundingClientRect(),side=document.querySelector('.rm-sidebar').getBoundingClientRect();return{topBottom:top.bottom,sideTop:side.top}});assert.ok(menu.sideTop>=menu.topBottom-2,JSON.stringify(menu));
           await page.evaluate(()=>{RinguCore.rankingProfiles=[['링구',765,15],['재원',703,12],['도현',676,10],['망고',574,8],['모험가',534,5]].map(([name,power,tower],i)=>({id:'pv3-'+i,uid:'PV3'+i,name,power,tower,gender:'male',equipment:[]}));RinguRanking.render();});
           await page.locator('.profile-button').click();await page.waitForFunction(()=>document.querySelectorAll('#rankList .rk-row').length>=5);await page.evaluate(()=>{RinguCore.rankingProfiles=[['링구',765,15],['재원',703,12],['도현',676,10],['망고',574,8],['모험가',534,5]].map(([name,power,tower],i)=>({id:'pv3-'+i,uid:'PV3'+i,name,power,tower,gender:'male',equipment:[]}));RinguRanking.render();});
           const rank=await page.locator('#rankList').evaluate(el=>{const list=el.getBoundingClientRect(),rows=[...el.querySelectorAll('.rk-row')].slice(0,5).map(r=>r.getBoundingClientRect());return{list:{top:list.top,bottom:list.bottom,height:list.height},rows:rows.map(r=>({top:r.top,bottom:r.bottom,height:r.height})),count:rows.length}});assert.equal(rank.count,5);assert.ok(rank.rows[4].bottom<=rank.list.bottom+1,JSON.stringify(rank));
           await page.screenshot({path:new URL('mobile-390.png',out).pathname,fullPage:false});assert.deepEqual(errors,[]);assert.deepEqual(unexpected,[]);console.log('PASS PV3 mobile: 3x2 HUD, no resource overflow, content below header, main/hunt/menu navigation, custom bottom icons and five ranking rows. Synthetic transport only.');
          }catch(e){if(activePage)await activePage.screenshot({path:new URL('failure.png',out).pathname}).catch(()=>{});console.log('PV3_DIAGNOSTIC',errors,unexpected);throw e;}finally{await browser.close();await new Promise(resolve=>server.close(resolve));}
          '''
          Path('test/pv3-mobile.test.mjs').write_text(s)
          PY
          QA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node test/pv3-mobile.test.mjs
      - name: Commit validated mobile fix
        run: |
          test "$(git branch --show-current)" = 'fix/mobile-layout-PV3-20260911'
          git rm -- .github/workflows/pv3-mobile-fix.yml
          git add -- premium-ui-v2.js premium-ui-v2.css remodel.js index.html test/pv3-mobile.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: stabilize mobile HUD grid, main navigation and five-row ranking'
          git push origin HEAD:refs/heads/fix/mobile-layout-PV3-20260911
          git rev-parse HEAD
