name: Verify live ranking presentation RK1
on:
  push:
    branches: [fix/ranking-RK1-20260911]
    paths: [.github/workflows/ranking-rk1-check.yml, ranking-ui.js, ranking-ui.css, test/ranking-ui-acceptance.txt]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Wire only the new ranking assets and synthetic browser fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          a='<script defer src="/linsa-rpg/black-market.js?v=refresh-BM4"></script>';assert s.count(a)==1
          s=s.replace(a,a+'\n<script defer src="/linsa-rpg/ranking-ui.js?v=ranking-RK1"></script>',1)
          a='<link rel="stylesheet" href="/linsa-rpg/remodel.css?v=gold-SG1">';assert s.count(a)==1
          s=s.replace(a,a+'\n<link rel="stylesheet" href="/linsa-rpg/ranking-ui.css?v=ranking-RK1">',1);p.write_text(s)
          s=Path('test/auction-mobile-ui.test.mjs').read_text();s=s[:s.index('try{\n const context=await browser.newContext')]
          a=s.index('const gear=');b=s.index('const costume=',a)
          s=s[:a]+'''const originalRows=Array.from({length:27},(_,i)=>({id:randomUUID(),uid:'TEST'+i,name:['링구','재원','망고','모험가'][i]||'기사 '+(i+1),power:[765,703,574,534][i]||490-i*9,tower:[2,10,5,0][i]??i%6,gender:'male',equipment:[],equippedAura:-1}));
          let rankingRows=structuredClone(originalRows),rankingFailure=false;
          state.towerCleared=3;state.playerName='도현';state.playerUid='RK1-TEST-UID';
          '''+s[b:]
          s=s.replace("case 'ringu_ranking':return {rows:[]};","case 'ringu_ranking':if(rankingFailure)throw Error('QA_RANKING_UNAVAILABLE');return {rows:rankingRows};",1)
          a=s.index("  case 'ringu_auction':{");b=s.index('  default:',a);s=s[:a]+s[b:]
          s=s.replace('../test-output/auction-AU2/','../test-output/ranking-RK1/')
          s+='try{\n'+Path('test/ranking-ui-acceptance.txt').read_text()+"\n}catch(e){if(activePage){console.log('RK1_DIAGNOSTIC',errors,unexpected,await activePage.locator('body').innerText().then(s=>s.slice(-1800)));await activePage.screenshot({path:new URL('failure.png',out).pathname}).catch(()=>{});}throw e;}finally{await browser.close();await new Promise(resolve=>server.close(resolve));}\n"
          Path('test/ranking-ui.test.mjs').write_text(s)
          PY
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          sudo timeout 60s apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Source and existing behavior regressions
        run: |
          node --check ranking-ui.js
          node --check test/ranking-ui.test.mjs
          node --test test/economy.test.mjs test/tower-hp-restored.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs test/login-inventory.test.mjs test/login-recovery.test.mjs
      - name: Real browser ranking tabs, identity mapping, mobile scrolling and controls
        run: QA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node test/ranking-ui.test.mjs
      - name: Commit tested page wiring to the isolated branch only
        run: |
          test "$(git branch --show-current)" = 'fix/ranking-RK1-20260911'
          git rm -- .github/workflows/ranking-rk1-check.yml test/ranking-ui-acceptance.txt
          git add -- index.html test/ranking-ui.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: verified gold-navy attack and tower ranking UI with live profiles'
          git push origin HEAD:refs/heads/fix/ranking-RK1-20260911
          git rev-parse HEAD
          sha256sum index.html ranking-ui.js ranking-ui.css
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ranking-RK1-QA
          path: test-output/ranking-RK1/
          retention-days: 1
