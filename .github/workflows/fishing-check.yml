name: Fishing feature checks
on:
  push:
    branches: [feat/fishing-177]
  pull_request:
    paths: ['rebirth/fishing*', 'rebirth/app.mjs', 'rebirth/engine.mjs']
permissions:
  contents: read
jobs:
  fishing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node rebirth/fishing.test.mjs && node --experimental-strip-types rebirth/fishing-access.test.mjs && node rebirth/consumables.test.mjs && node rebirth/shop.test.mjs
      - run: node rebirth/fishing.browser.test.mjs
        env:
          QA_BROWSER_BIN: /opt/google/chrome/chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-screenshots
          path: test-artifacts/fishing/
