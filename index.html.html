<!DOCTYPE html>
<html lang="ko">
<head>

<title>검강화 RPG</title>
<style>

or-mix(in srgb,var(--rarity) 14%,transparent);font-weight:900}.item-title strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sub{font-size:10px;color:var(--muted);margin-top:5px}.item-sub b{color:#d9e5ff}.up{color:var(--green);font-weight:1000}.item-actions{display:grid;grid-template-columns:repeat(3,42px);gap:4px;align-content:center}.item-actions button{padding:7px 2px;border-radius:7px;background:#202a3d;font-size:9px}.item-actions .enh{color:var(--gold)}.item-actions .sell{color:#ff8695}.item-actions button:disabled{opacity:.3}.empty-list{text-align:center;color:var(--muted);padding:45px 0;font-size:12px}.toast-wrap{position:fixed;z-index:80;top:100px;left:50%;transform:translateX(-50%);width:min(90%,360px);pointer-events:none}.toast{margin:6px;padding:10px 13px;border-radius:9px;background:#20283aee;border:1px solid #3b4965;box-shadow:var(--shadow);font-size:11px;text-align:center;animation:toast 2.3s forwards}.modal-bg{display:none;position:fixed;z-index:100;inset:0;background:#000b;backdrop-filter:blur(4px);padding:20px;align-items:center;justify-content:center}.modal-bg.show{display:flex}.modal{width:min(390px,100%);background:#151b28;border:1px solid #34415b;border-radius:18px;padding:18px;box-shadow:0 20px 60px #000}.modal h3{margin:0 0 8px;font-size:17px}.modal p{font-size:11px;color:var(--muted);line-height:1.7}.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:13px 0}.modal-stats div{background:#0d111a;padding:9px 4px;text-align:center;border-radius:8px;font-size:10px}.modal-stats b{display:block;margin-top:3px;color:var(--gold)}.modal-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:7px}.modal-actions button{padding:12px;border-radius:9px;background:#293247;font-weight:900;font-size:11px}.modal-actions .primary{background:linear-gradient(#e28d2d,#9a5018)}.legend-overlay{display:none;position:fixed;z-index:200;inset:0;background:radial-gradient(circle,#ffbd4c66,#d35c0018 35%,#000c 70%);align-items:center;justify-content:center;text-align:center}.legend-overlay.show{display:flex;animation:legendBg 2.2s}.legend-card{padding:35px 24px;border:2px solid #ffc55c;background:#2a1609ee;border-radius:20px;box-shadow:0 0 30px #ff9d3b,0 0 100px #ff6a00;animation:legendCard 2.2s}.legend-card small{color:#ffd693;letter-spacing:5px}.legend-card h2{font-size:29px;margin:10px;color:#fff1c9;text-shadow:0 0 20px #ff9d3b}.legend-card p{color:#ffb84f}.offline-gold{font-size:25px!important;color:var(--gold)!important;font-weight:1000}.rarity-0{--rarity:#a5adba}.rarity-1{--rarity:#4fd27b}.rarity-2{--rarity:#459cff}.rarity-3{--rarity:#bc64ff}.rarity-4{--rarity:#ff9d3b}.legendary{animation:legendGlow 1.4s infinite alternate}@keyframes float{50%{transform:translateY(-8px)}}@keyframes hit{50%{transform:translateX(7px) scale(.92);filter:brightness(2)}}@keyframes damage{0%{opacity:0;transform:translate(-50%,15px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-55px) scale(.9)}}@keyframes toast{0%{opacity:0;transform:translateY(-8px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}@keyframes legendBg{0%,100%{opacity:0}10%,85%{opacity:1}}@keyframes legendCard{0%{transform:scale(.2) rotate(-8deg);opacity:0}20%{transform:scale(1.08) rotate(1deg);opacity:1}30%,100%{transform:scale(1)}}@keyframes legendGlow{to{box-shadow:0 0 17px #ff9d3b55,inset 0 0 10px #ff9d3b22}}body.shake{animation:shake .45s}@keyframes shake{20%{transform:translate(5px,-3px)}40%{transform:translate(-5px,2px)}60%{transform:translate(4px,3px)}80%{transform:translate(-3px,-2px)}}@media(min-width:850px){.app{padding-left:16px;padding-right:16px}.topbar{margin:0 -16px 12px;padding-left:16px;padding-right:16px}.brand-row{margin-bottom:0}.topbar{display:flex;align-items:center;justify-content:space-between}.stats{width:580px}.layout{grid-template-columns:230px minmax(400px,1fr) 290px;align-items:start}.boss-panel{grid-column:1;grid-row:1}.battle-panel{grid-column:2;grid-row:1 / span 2}.equip-panel{grid-column:3;grid-row:1}.boss-list{display:grid;overflow:visible}.boss-btn{width:100%;flex:auto}.quick{grid-column:1/4}.summon-panel{grid-column:1/4}.inventory{grid-column:1/4}.arena{min-height:415px}.equip-grid{grid-template-columns:1fr}.battle-log{height:118px}.inventory-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 8px;max-height:500px}}@media(min-width:1200px){.inventory-list{grid-template-columns:repeat(3,1fr)}}
.battle-toggle{margin-top:6px;padding:6px 12px;border-radius:999px;background:#3b1822;border:1px solid #723040;color:#ff9aa7;font-size:10px;font-weight:900}.battle-toggle.on{background:#173b31;border-color:#2e8066;color:#70efbd;box-shadow:0 0 12px #50e39a33}.rate-btn{background:#25204a;border:1px solid #6651b5;color:#d6caff;border-radius:7px;padding:5px 8px;font-size:9px;font-weight:800}.rate-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:10px;text-align:center}.rate-table th,.rate-table td{padding:7px 2px;border-bottom:1px solid #293247}.rate-table th{color:var(--muted);font-weight:700}.rate-table tr.current{background:#28214b;color:#fff}.rate-table td:last-child{color:var(--orange);font-weight:900}.rate-scroll{max-height:55vh;overflow:auto}
.region-tabs{display:flex;gap:6px;padding:0 10px 9px;overflow-x:auto}.region-tab{flex:none;padding:7px 11px;border-radius:8px;background:#171e2c;border:1px solid #2a354b;color:var(--muted);font-size:10px;font-weight:800}.region-tab.active{color:#9bf1bb;border-color:#3d8b63;background:#173428}.region-tab.locked{opacity:.45}.stats-panel{margin-top:10px}.player-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:0 10px 11px}.player-stat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#111722;border:1px solid #273146;border-radius:9px;font-size:10px;color:var(--muted)}.player-stat b{color:#e8f1ff;font-size:12px}.player-stat.primary{grid-column:1/-1;background:linear-gradient(110deg,#14233b,#111722);border-color:#31527c}.player-stat.primary b{color:#74c4ff;font-size:16px}.sub-options{margin-top:5px;color:#86d8ff;font-size:9px;line-height:1.55}.equip-slot .sub-options{white-space:normal}.stat-formula{padding:0 11px 11px;color:#69778d;font-size:9px}.item.locked-item{box-shadow:inset 0 0 0 1px #ffd35a55}.item-actions{grid-template-columns:repeat(2,42px)!important}.item-actions .lock{color:#aebbd0}.item-actions .lock.on{color:var(--gold);background:#3b321b}.summon-kind{color:#c7b9ff}

<body>
<main class="app">
 <header class="topbar"><div class="brand-row"><div class="brand"><b>검강화</b> RPG</div><div class="save-dot">자동 저장</div></div><div class="stats"><div class="stat gold"><span class="stat-label">보유 골드</span><span class="stat-value" id="gold">0</span></div><div class="stat power"><span class="stat-label">공격력</span><span class="stat-value" id="power">10</span></div><div class="stat"><span class="stat-label">소환 레벨</span><span class="stat-value" id="summonTop">Lv.1</span><div class="summon-mini"><i id="summonMini"></i></div></div></div></header>
 <section class="layout">
  <div class="panel boss-panel"><div class="panel-title">보스 선택 <small>지역별 보스</small></div><div class="region-tabs" id="regionTabs"></div><div class="boss-list" id="bossList"></div></div>
  <div class="panel battle-panel"><div class="arena" id="arena"><div class="battle-head"><h2 id="bossName"></h2><p id="battleState">자동 전투 중 · 1초마다 공격</p><button class="battle-toggle on" id="battleToggle" onclick="toggleAutoBattle()">자동사냥 ON</button></div><div class="boss-art" id="bossArt"><div class="boss-core"><i></i></div></div><div class="hp-wrap"><div class="hp-row"><b>보스 HP</b><span id="hpText"></span></div><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div><div class="timer"><i id="timerFill"></i></div></div><div class="battle-log" id="battleLog"></div></div></div>
  <div class="panel equip-panel"><div class="panel-title">장착 장비 <small id="equipAtk">공격력 +0</small></div><div class="equip-grid" id="equipGrid"></div></div>
  <div class="panel stats-panel"><div class="panel-title">플레이어 능력치 <small>장착 장비 적용</small></div><div class="player-stats" id="playerStats"></div><div class="stat-formula">최종 공격력 = (기본 공격력 + 장비 공격력) × (1 + 공격력%)</div></div>
  <nav class="quick"><button onclick="scrollToId('summonPanel')">장비 뽑기</button><button onclick="openBestEnhance()">강화</button><button onclick="scrollToId('inventoryPanel')">판매</button><button class="best" onclick="equipBest()">최적 장착</button></nav>
  <div class="panel summon-panel" id="summonPanel"><div class="panel-title">장비 소환 <button class="rate-btn" onclick="openRates()">레벨별 확률</button></div><div class="summon-level"><div class="level-line"><b id="summonLevel"></b><span id="summonExp"></span></div><div class="expbar"><i id="expFill"></i></div></div><div class="summon-tabs"><button class="summon-tab active" data-group="weapon">무기</button><button class="summon-tab" data-group="armor">방어구</button><button class="summon-tab" data-group="accessory">장신구</button></div><div class="draw-buttons"><button class="draw" onclick="drawItems(1)">1회 소환<span>5,000 G</span></button><button class="draw" onclick="drawItems(5)">5회 소환<span>25,000 G</span></button><button class="draw" onclick="drawItems(10)">10회 소환<span>50,000 G</span></button></div></div>
  <div class="panel inventory" id="inventoryPanel"><div class="panel-title">인벤토리 <small id="invCount">0개</small></div><div class="inventory-tools"><select id="sortSelect"><option value="attack">공격력순</option><option value="rarity">등급순</option></select><button class="sell-bulk" onclick="bulkSell(0)">일반 판매</button><button class="sell-bulk" onclick="bulkSell(1)">희귀 이하</button><button class="sell-bulk" onclick="bulkSell(2)">레어 이하</button></div><div class="inventory-list" id="inventoryList"></div></div>
 </section>
</main>
<div class="toast-wrap" id="toasts"></div>
<div class="modal-bg" id="enhanceModal"><div class="modal"><h3 id="enhanceTitle">장비 강화</h3><p id="enhanceDesc"></p><div class="modal-stats"><div>현재 강화<b id="enhNow"></b></div><div>성공 확률<b id="enhRate"></b></div><div>강화 비용<b id="enhCost"></b></div></div><div class="modal-actions"><button onclick="closeEnhance()">닫기</button><button class="primary" id="enhanceBtn">강화 시도</button></div></div></div>
<div class="modal-bg" id="offlineModal"><div class="modal"><h3>오프라인 보상</h3><p>자리를 비운 동안에도 전투는 계속되었습니다.</p><p class="offline-gold" id="offlineGold"></p><div class="modal-actions" style="grid-template-columns:1fr"><button class="primary" onclick="closeOffline()">보상 받기</button></div></div></div>
<div class="modal-bg" id="rateModal"><div class="modal"><h3>소환 레벨별 확률</h3><p>소환 레벨은 최대 Lv.10이며, 모든 장비 소환에 동일하게 적용됩니다.</p><div class="rate-scroll" id="rateTable"></div><div class="modal-actions" style="grid-template-columns:1fr"><button class="primary" onclick="closeRates()">확인</button></div></div></div>
<div class="legend-overlay" id="legendOverlay"><div class="legend-card"><small>LEGENDARY</small><h2>전설 장비 획득!</h2><p id="legendName"></p></div></div>
<script>
(()=>{'use strict';
const KEY='swordEnhanceRPG_v1';
const slots=['무기','투구','갑옷','바지','신발','반지','귀걸이'];
const rarityNames=['일반','희귀','레어','에픽','전설'];
const rarityColors=['#a5adba','#4fd27b','#459cff','#bc64ff','#ff9d3b'];
const atkRanges=[[8,10],[18,22],[48,55],[120,135],[400,430]];
const sellPrices=[100,300,1000,5000,30000];
const levelReq=[0,100,250,500,1000,2000,4000,8000,12000,20000];
const bossRegions=[{name:'초원',bosses:[{name:'초원 슬라임',hp:100,reward:100},{name:'초원 늑대',hp:250,reward:250},{name:'거대 멧돼지',hp:500,reward:500},{name:'숲의 고블린',hp:1000,reward:1000},{name:'초원 수호자',hp:2000,reward:2000},{name:'숲 정령',hp:5000,reward:5000}]},{name:'사막',bosses:[{name:'모래 전갈',hp:8000,reward:7000},{name:'사막 하이에나',hp:13000,reward:11000},{name:'고대 미라',hp:22000,reward:18000},{name:'모래폭풍 정령',hp:38000,reward:30000},{name:'사막의 폭군',hp:65000,reward:50000}]},{name:'설원',locked:true,bosses:[]},{name:'화산',locked:true,bosses:[]},{name:'천공',locked:true,bosses:[]}];
const prefixes=[['낡은','수련용','견습의','무딘','가벼운','초보자의','평범한','손때 묻은','여행자의','단단한'],['숲바람의','청동빛','사냥꾼의','용병의','새벽녘','바람결의','야성의','수호병의','비취빛','은은한'],['빙결의','뇌광의','심연의','왕실의','폭풍의','적월의','별빛의','환영의','백은의','용맹한'],['천공의','불멸의','마왕의','성역의','고대룡의','운명의','차원절단','패왕의','신탁의','황혼의'],['태양의','창세의','천벌의','신왕의','세계수의','종말의','라그나로크','아포칼립스','발할라의','오딘의']];
const bases={무기:['장검','검','대검','환도','마검','성검','쌍검','도','검날','룬소드'],투구:['철투구','면갑','전투모','왕관','뿔투구','기사투구','두건','투구','머리장식','가면'],갑옷:['흉갑','판금갑옷','전투복','사슬갑옷','로브','용갑','수호갑','갑주','성의','전신갑옷'],바지:['각반','전투바지','하의','다리갑옷','사슬바지','용린각반','마법바지','수호각반','철갑바지','성전하의'],신발:['장화','군화','철구두','전투화','질풍화','용린신','마법장화','수호신','각갑','성전장화'],반지:['철반지','인장','보석반지','룬링','옥반지','마력반지','서약반지','왕의인장','수호링','성전반지'],귀걸이:['철귀걸이','수정귀걸이','별귀걸이','룬이어링','옥귀걸이','마력귀걸이','서약귀걸이','왕의귀걸이','수호이어링','성전귀걸이']};
const rates=[[75,20,4.5,.45,.05],[70,23,6,.93,.07],[65,25,8,1.91,.09],[60,27,10,2.89,.11],[55,29,12,3.87,.13],[50,30,15,4.85,.15],[45,31,17,6.84,.16],[40,32,19,8.83,.17],[35,33,21,10.81,.19],[30,34,23,12.8,.2]];
const defaults={gold:50000,inventory:[],equipped:{},summons:null,summonExp:0,summonLevel:1,regionIndex:0,bossIndex:0,autoBattle:true,lastSeen:Date.now(),uid:1};
let state,combat={hp:100,elapsed:0,logs:[]},drawGroup='weapon',enhanceId=null,saveTimer;
const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('ko-KR');
function currentBosses(){return (bossRegions[state.regionIndex]||bossRegions[0]).bosses}
function currentBoss(){return currentBosses()[state.bossIndex]||currentBosses()[0]}
function load(){try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'));state.inventory=Array.isArray(state.inventory)?state.inventory:[];state.equipped=state.equipped||{};state.uid=state.uid||Date.now()}catch(e){state=structuredClone(defaults)}const oldExp=state.summonExp||0;if(!state.summons)state.summons={weapon:{exp:oldExp},armor:{exp:oldExp},accessory:{exp:oldExp}};['weapon','armor','accessory'].forEach(k=>{state.summons[k]=state.summons[k]||{exp:0};state.summons[k].exp=state.summons[k].exp||0;state.summons[k].level=getSummonLevel(state.summons[k].exp)});state.inventory.forEach(it=>{it.enhance=Math.min(15,Math.max(0,it.enhance||0));it.locked=!!it.locked});state.regionIndex=Math.min(state.regionIndex||0,bossRegions.length-1);if(bossRegions[state.regionIndex].locked)state.regionIndex=0;state.bossIndex=Math.min(state.bossIndex||0,currentBosses().length-1);const away=Math.min(28800,Math.max(0,(Date.now()-(state.lastSeen||Date.now()))/1000));if(state.autoBattle&&away>=60){const b=currentBoss(),cycle=Math.max(1,Math.min(30,Math.ceil(b.hp/getPower()))),reward=Math.floor(Math.floor(away/cycle)*b.reward*(1+getPlayerStats().goldBonus/100));state.gold+=reward;setTimeout(()=>{$('offlineGold').textContent='+'+fmt(reward)+' 골드';$('offlineModal').classList.add('show')},350)}resetCombat();renderAll();save()}
function save(){state.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,250)}
function getSummonLevel(exp){let lv=1;for(let i=1;i<levelReq.length;i++)if(exp>=levelReq[i])lv=i+1;return lv}
function activeSummon(){return state.summons[drawGroup]}
function itemAtk(it){const steps=[3,6.85,14.25,27.5,25];return Math.floor(it.baseAtk+(steps[it.rarity]||3)*it.enhance)}
function subOptions(it){const ratio=[.1,.25,.5,.75,1][it.rarity]||.1,opts=[];if(it.slot==='무기')opts.push(['critChance',10*ratio]);if(it.slot==='투구')opts.push(['atkPercent',20*ratio]);if(it.slot==='갑옷')opts.push(['goldBonus',20*ratio]);if(it.slot==='바지')opts.push(['goldBonus',25*ratio]);if(it.slot==='신발')opts.push(['critChance',10*ratio],['critDamage',50*ratio]);if(it.slot==='반지')opts.push(['critDamage',50*ratio]);if(it.slot==='귀걸이')opts.push(['atkPercent',20*ratio]);return opts}
function optionName(key){return{atkPercent:'공격력',critChance:'치명타 확률',critDamage:'치명타 피해',goldBonus:'골드 획득량'}[key]}
function optionText(it){return subOptions(it).map(([key,value])=>optionName(key)+' +'+Number(value.toFixed(1))+'%').join('<br>')}
function getPlayerStats(){let equipmentAtk=0,atkPercent=0,critChance=10,critDamage=100,goldBonus=0;Object.values(state.equipped||{}).forEach(id=>{const it=state.inventory.find(x=>x.id===id);if(!it)return;equipmentAtk+=itemAtk(it);subOptions(it).forEach(([key,value])=>{if(key==='atkPercent')atkPercent+=value;if(key==='critChance')critChance+=value;if(key==='critDamage')critDamage+=value;if(key==='goldBonus')goldBonus+=value})});critChance=Math.min(75,critChance);const attack=Math.floor((10+equipmentAtk)*(1+atkPercent/100));return{baseAttack:10,equipmentAtk,attack,atkPercent,critChance,critDamage,goldBonus}}
function getPower(){return getPlayerStats().attack}
function isEquipped(id){return Object.values(state.equipped).includes(id)}
function rarityRoll(){let roll=Math.random()*100,total=0,rr=rates[activeSummon().level-1];for(let i=0;i<rr.length;i++){total+=rr[i];if(roll<total)return i}return 4}
function makeItem(group){let candidates=group==='weapon'?['무기']:group==='armor'?['투구','갑옷','바지','신발']:['반지','귀걸이'];let slot=candidates[Math.floor(Math.random()*candidates.length)],rarity=rarityRoll(),idx=Math.floor(Math.random()*10),range=atkRanges[rarity];return{id:state.uid++,slot,rarity,name:prefixes[rarity][idx]+' '+bases[slot][idx],baseAtk:Math.floor(Math.random()*(range[1]-range[0]+1))+range[0],enhance:0}}
function drawItems(count){const cost=count*5000;if(state.gold<cost)return toast('골드가 부족합니다.');state.gold-=cost;let gained=[];for(let i=0;i<count;i++)gained.push(makeItem(drawGroup));state.inventory.unshift(...gained);const summon=activeSummon(),old=summon.level;summon.exp+=count;summon.level=getSummonLevel(summon.exp);if(summon.level>old)toast(groupName(drawGroup)+' 소환 Lv.'+summon.level+' 달성!');renderAll();queueSave();const legs=gained.filter(x=>x.rarity===4);if(legs.length)legendEffect(legs[0]);else toast(count+'개 장비를 획득했습니다.')}
function equip(id,quiet=false){const it=state.inventory.find(x=>x.id===id);if(!it)return;state.equipped[it.slot]=it.id;if(!quiet)toast(it.name+' 장착 완료');renderAll();queueSave()}
function equipBest(){let changed=0;slots.forEach(slot=>{const best=state.inventory.filter(x=>x.slot===slot).sort((a,b)=>itemAtk(b)-itemAtk(a))[0];if(best&&state.equipped[slot]!==best.id){state.equipped[slot]=best.id;changed++}});toast(changed?'최고 공격력 장비를 장착했습니다.':'이미 최적 장비입니다.');renderAll();queueSave()}
function sellItem(id){if(isEquipped(id))return toast('장착 중인 장비는 판매할 수 없습니다.');const i=state.inventory.findIndex(x=>x.id===id);if(i<0)return;const it=state.inventory[i];if(it.locked)return toast('잠긴 장비는 판매할 수 없습니다.');state.gold+=sellPrices[it.rarity];state.inventory.splice(i,1);toast(fmt(sellPrices[it.rarity])+' 골드 획득');renderAll();queueSave()}
function bulkSell(maxRarity){let sold=state.inventory.filter(x=>x.rarity<=maxRarity&&!isEquipped(x.id)&&!x.locked);if(!sold.length)return toast('판매 가능한 장비가 없습니다.');let ids=new Set(sold.map(x=>x.id)),gold=sold.reduce((s,x)=>s+sellPrices[x.rarity],0);state.inventory=state.inventory.filter(x=>!ids.has(x.id));state.gold+=gold;toast(sold.length+'개 판매 · +'+fmt(gold)+' 골드');renderAll();queueSave()}
function toggleLock(id){const it=state.inventory.find(x=>x.id===id);if(!it)return;it.locked=!it.locked;toast(it.locked?'장비를 잠갔습니다.':'장비 잠금을 해제했습니다.');renderInventory();queueSave()}
function successRate(target){return[100,100,100,95,90,85,80,70,60,50,40,30,20,10,5][target-1]||0}
function enhanceCost(it){return Math.floor(700*Math.pow(it.enhance+1,1.72)/100)*100+500}
function openEnhance(id){const it=state.inventory.find(x=>x.id===id);if(!it)return;enhanceId=id;$('enhanceModal').classList.add('show');renderEnhance()}
function openBestEnhance(){const equipped=Object.values(state.equipped).map(id=>state.inventory.find(x=>x.id===id)).filter(Boolean).sort((a,b)=>itemAtk(b)-itemAtk(a));if(!equipped.length)return toast('먼저 장비를 장착해 주세요.');openEnhance(equipped[0].id)}
function renderEnhance(){const it=state.inventory.find(x=>x.id===enhanceId);if(!it)return closeEnhance();$('enhanceTitle').textContent=it.name;$('enhanceDesc').innerHTML=rarityNames[it.rarity]+' '+it.slot+' · 공격력 <b>'+fmt(itemAtk(it))+'</b><br><span style="color:#86d8ff">'+optionText(it)+'</span><br>실패 시 강화 수치가 1 감소합니다.'+(it.enhance>=15?'<br>최대 강화에 도달했습니다.':'');$('enhNow').textContent='+'+it.enhance;$('enhRate').textContent=it.enhance>=15?'-':successRate(it.enhance+1)+'%';$('enhCost').textContent=it.enhance>=15?'-':fmt(enhanceCost(it))+' G';$('enhanceBtn').disabled=it.enhance>=15}
function tryEnhance(){const it=state.inventory.find(x=>x.id===enhanceId);if(!it||it.enhance>=15)return;const cost=enhanceCost(it),target=it.enhance+1;if(state.gold<cost)return toast('강화 골드가 부족합니다.');state.gold-=cost;if(Math.random()*100<successRate(target)){it.enhance++;toast('강화 성공! +'+it.enhance);if(it.enhance%5===0)document.body.classList.add('shake'),setTimeout(()=>document.body.classList.remove('shake'),450)}else{it.enhance=Math.max(0,it.enhance-1);toast('강화 실패 · +'+it.enhance+'로 하락')}renderAll();renderEnhance();queueSave()}
function closeEnhance(){$('enhanceModal').classList.remove('show');enhanceId=null}
function closeOffline(){$('offlineModal').classList.remove('show');save()}
function openRates(){let rows=rates.map((r,i)=>'<tr class="'+(i+1===activeSummon().level?'current':'')+'"><td>Lv.'+(i+1)+'</td>'+r.map((v,j)=>'<td style="color:'+rarityColors[j]+'">'+v+'%</td>').join('')+'</tr>').join('');$('rateTable').innerHTML='<p class="summon-kind">'+groupName(drawGroup)+' 소환 확률</p><table class="rate-table"><thead><tr><th>레벨</th>'+rarityNames.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>';$('rateModal').classList.add('show')}
function closeRates(){$('rateModal').classList.remove('show')}
function toggleAutoBattle(){state.autoBattle=!state.autoBattle;if(!state.autoBattle)addLog('자동사냥을 중지했습니다.');else addLog('자동사냥을 시작했습니다.');renderBattle();queueSave()}
function selectRegion(i){if(bossRegions[i].locked)return toast(bossRegions[i].name+' 지역은 아직 미개봉입니다.');state.regionIndex=i;state.bossIndex=0;resetCombat();renderBosses();renderBattle();addLog(bossRegions[i].name+' 지역으로 이동했습니다.');queueSave()}
function selectBoss(i){state.bossIndex=i;resetCombat();renderBosses();renderBattle();addLog(currentBoss().name+' 전투를 시작합니다.');queueSave()}
function resetCombat(){const b=currentBoss();combat.hp=b.hp;combat.elapsed=0}
function attack(){if(!state.autoBattle)return;const b=currentBoss(),stats=getPlayerStats(),crit=Math.random()*100<stats.critChance,damage=Math.floor(stats.attack*(crit?1+stats.critDamage/100:1));combat.hp=Math.max(0,combat.hp-damage);combat.elapsed++;showDamage(damage,crit);$('bossArt').classList.add('hit');setTimeout(()=>$('bossArt').classList.remove('hit'),180);if(combat.hp<=0){const reward=Math.floor(b.reward*(1+stats.goldBonus/100));state.gold+=reward;addLog('<b>'+b.name+'</b> 처치! +'+fmt(reward)+' 골드');$('battleState').textContent='처치 성공 · 자동 재도전';setTimeout(resetCombat,300);queueSave()}else if(combat.elapsed>=30){addLog('<span style="color:#ff7182">전투 실패</span> · 즉시 재도전');$('battleState').textContent='시간 초과 · 즉시 재도전';resetCombat()}renderTop();renderBattle()}
function showDamage(dmg,crit){const el=document.createElement('div');el.className='damage-pop'+(crit?' crit':'');el.textContent=(crit?'CRITICAL! ':'-')+fmt(dmg);$('arena').appendChild(el);setTimeout(()=>el.remove(),750)}
function addLog(html){combat.logs.unshift(html);combat.logs=combat.logs.slice(0,5);$('battleLog').innerHTML=combat.logs.map(x=>'<div>'+x+'</div>').join('')}
function groupName(group){return{weapon:'무기',armor:'방어구',accessory:'장신구'}[group]}
function renderTop(){const power=getPower(),summon=activeSummon();$('gold').textContent=fmt(state.gold);$('power').textContent=fmt(power);$('summonTop').textContent=groupName(drawGroup)+' Lv.'+summon.level;const p=getExpProgress(summon);$('summonMini').style.width=p.percent+'%'}
function getExpProgress(summon){const lv=summon.level;if(lv>=10)return{cur:summon.exp,next:levelReq[9],percent:100};const base=levelReq[lv-1],next=levelReq[lv];return{cur:summon.exp,next,percent:Math.max(0,(summon.exp-base)/(next-base)*100)}}
function renderBosses(){$('regionTabs').innerHTML=bossRegions.map((r,i)=>'<button class="region-tab '+(i===state.regionIndex?'active ':'')+(r.locked?'locked':'')+'" onclick="selectRegion('+i+')">'+(r.locked?'잠금 · ':'')+r.name+'</button>').join('');$('bossList').innerHTML=currentBosses().map((b,i)=>'<button class="boss-btn '+(i===state.bossIndex?'active':'')+'" onclick="selectBoss('+i+')"><strong>'+b.name+'</strong><span>HP '+fmt(b.hp)+' · '+fmt(b.reward)+' G</span></button>').join('')}
function renderBattle(){const b=currentBoss(),toggle=$('battleToggle');$('bossName').textContent=b.name;$('hpText').textContent=fmt(combat.hp)+' / '+fmt(b.hp);$('hpFill').style.width=(combat.hp/b.hp*100)+'%';$('timerFill').style.width=Math.max(0,(30-combat.elapsed)/30*100)+'%';toggle.textContent='자동사냥 '+(state.autoBattle?'ON':'OFF');toggle.classList.toggle('on',state.autoBattle);if(combat.hp>0)$('battleState').textContent=state.autoBattle?'자동 전투 중 · '+combat.elapsed+' / 30초':'자동사냥 중지 · 버튼을 눌러 시작'}
function renderEquipment(){let sum=0;$('equipGrid').innerHTML=slots.map(slot=>{const it=state.inventory.find(x=>x.id===state.equipped[slot]);if(it){sum+=itemAtk(it);return '<button class="equip-slot rarity-'+it.rarity+(it.rarity===4?' legendary':'')+'" onclick="openEnhance('+it.id+')"><span class="slot-name">'+slot+'</span><strong style="color:'+rarityColors[it.rarity]+'">'+it.name+' +'+it.enhance+'</strong><em>공격력 '+fmt(itemAtk(it))+'</em><div class="sub-options">'+optionText(it)+'</div></button>'}return '<button class="equip-slot" onclick="scrollToId(\'inventoryPanel\')"><span class="slot-name">'+slot+'</span><strong class="empty">장비 없음</strong><em>탭하여 찾기</em></button>'}).join('');$('equipAtk').textContent='공격력 +'+fmt(sum)}
function renderPlayerStats(){const s=getPlayerStats();$('playerStats').innerHTML='<div class="player-stat primary"><span>공격력</span><b>'+fmt(s.attack)+'</b></div><div class="player-stat"><span>공격력%</span><b>'+Number(s.atkPercent.toFixed(1))+'%</b></div><div class="player-stat"><span>치명타 확률</span><b>'+Number(s.critChance.toFixed(1))+'%</b></div><div class="player-stat"><span>치명타 피해</span><b>'+Number(s.critDamage.toFixed(1))+'%</b></div><div class="player-stat"><span>골드 획득량</span><b>+'+Number(s.goldBonus.toFixed(1))+'%</b></div>'}
function renderSummon(){const summon=activeSummon(),p=getExpProgress(summon);$('summonLevel').textContent=groupName(drawGroup)+' 소환 Lv.'+summon.level;$('summonExp').textContent=summon.level>=10?fmt(summon.exp)+' EXP · MAX':fmt(summon.exp)+' / '+fmt(p.next)+' EXP';$('expFill').style.width=p.percent+'%'}
function renderInventory(){let list=[...state.inventory],sort=$('sortSelect').value;list.sort((a,b)=>sort==='rarity'?(b.rarity-a.rarity||itemAtk(b)-itemAtk(a)):itemAtk(b)-itemAtk(a));$('invCount').textContent=list.length+'개';$('inventoryList').innerHTML=list.length?list.map(it=>{const atk=itemAtk(it),eqId=state.equipped[it.slot],eq=state.inventory.find(x=>x.id===eqId),up=!isEquipped(it.id)&&atk>(eq?itemAtk(eq):0);return '<div class="item rarity-'+it.rarity+(isEquipped(it.id)?' equipped':'')+(it.locked?' locked-item':'')+(it.rarity===4?' legendary':'')+'"><div class="item-info"><div class="item-title"><span class="rarity">'+rarityNames[it.rarity]+'</span><strong style="color:'+rarityColors[it.rarity]+'">'+(it.locked?'[잠금] ':'')+it.name+' +'+it.enhance+'</strong></div><div class="item-sub">'+it.slot+' · 공격력 <b>'+fmt(atk)+'</b> '+(up?'<span class="up">↑ 추천</span>':'')+(isEquipped(it.id)?'<span style="color:#6eb8ff"> · 장착 중</span>':'')+'<div class="sub-options">'+optionText(it)+'</div></div></div><div class="item-actions"><button onclick="equip('+it.id+')">장착</button><button class="enh" onclick="openEnhance('+it.id+')">강화</button><button class="lock '+(it.locked?'on':'')+'" onclick="toggleLock('+it.id+')">'+(it.locked?'해제':'잠금')+'</button><button class="sell" '+(isEquipped(it.id)||it.locked?'disabled':'')+' onclick="sellItem('+it.id+')">판매</button></div></div>'}).join(''):'<div class="empty-list">장비가 없습니다.<br>소환으로 첫 장비를 획득하세요.</div>'}
function renderAll(){renderTop();renderBosses();renderBattle();renderEquipment();renderPlayerStats();renderSummon();renderInventory()}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('toasts').appendChild(el);setTimeout(()=>el.remove(),2400)}
function legendEffect(it){$('legendName').textContent=it.name;$('legendOverlay').classList.add('show');document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500);setTimeout(()=>$('legendOverlay').classList.remove('show'),2200)}
function scrollToId(id){$(id).scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelectorAll('.summon-tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.summon-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');drawGroup=btn.dataset.group;renderTop();renderSummon()});
$('sortSelect').onchange=renderInventory;$('enhanceBtn').onclick=tryEnhance;$('enhanceModal').onclick=e=>{if(e.target===$('enhanceModal'))closeEnhance()};
Object.assign(window,{drawItems,equip,equipBest,sellItem,bulkSell,toggleLock,openEnhance,openBestEnhance,tryEnhance,closeEnhance,closeOffline,openRates,closeRates,toggleAutoBattle,selectRegion,selectBoss,scrollToId});
window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});setInterval(attack,1000);setInterval(save,10000);load();
})();
</script>
</body>
