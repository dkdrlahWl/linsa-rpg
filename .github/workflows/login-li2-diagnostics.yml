name: Diagnose login endpoint availability LI2
on:
  push:
    branches: [diagnose/login-LI2-20260910]
    paths: [.github/workflows/login-li2-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe public health and unauthenticated rejection only
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error,concurrent.futures
          from pathlib import Path
          config=json.loads(re.search(r'=(\{.*\});',Path('cloud-config.js').read_text()).group(1))
          # Only the already-public publishable key. No passwords, tokens or user IDs.
          targets=[('pages-login','https://dkdrlahwl.github.io/linsa-rpg/login.html',None,{}),('auth-health',config['url']+'/auth/v1/health',None,{'apikey':config['publishableKey']}),('auth-settings',config['url']+'/auth/v1/settings',None,{'apikey':config['publishableKey']}),('account-unauthenticated',config['url']+'/rest/v1/rpc/ringu_account',b'{"p_action":"ping"}',{'apikey':config['publishableKey'],'Content-Type':'application/json'})]
          def probe(t):
              name,url,data,headers=t;start=time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers),timeout=15) as response:
                      body=response.read(); result={'name':name,'status':response.status,'bytes':len(body),'seconds':round(time.monotonic()-start,3)}
                      if name=='pages-login':result['LI1_present']=b'login-inventory-LI1' in body
                      return result
              except urllib.error.HTTPError as e:
                  body=e.read(1024);result={'name':name,'status':e.code,'seconds':round(time.monotonic()-start,3)}
                  try:result['code']=json.loads(body).get('code')
                  except Exception:pass
                  return result
              except Exception as e:return {'name':name,'error':type(e).__name__,'seconds':round(time.monotonic()-start,3)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(probe,targets): print(json.dumps(result))
          PY
