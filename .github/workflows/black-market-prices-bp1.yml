name: Validate black market prices BP1
on:
  push:
    branches: [fix/black-market-prices-BP1-20260911]
    paths: [.github/workflows/black-market-prices-bp1.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned isolated QA and migration CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/bp1-qa" --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.5.8
          npm install --prefix "$RUNNER_TEMP/bp1-cli" --no-audit --no-fund --no-save supabase@2.81.3
          "$RUNNER_TEMP/bp1-cli/node_modules/.bin/supabase" migration new --help
          "$RUNNER_TEMP/bp1-cli/node_modules/.bin/supabase" migration new black_market_prices_bp1
      - name: Prepare bounded price-only source changes and migration regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def change(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old);p.write_text(s.replace(old,new,1))
          expected={'black-market.js':'a0f21e67586f839da7b27aa27c942b49f0ac3430','test/black-market-db.test.mjs':'1da40dc18846ede1ef135e05a2510eed70497cc2'}
          for name,sha in expected.items():
              b=Path(name).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,name
          change('black-market.js','[5,15,50,100][i]','[5,15,30,50][i]')
          change('black-market.js','암시장 BM2','암시장 BP1')
          change('black-market.js',"version:'BM2'","version:'BP1'")
          change('index.html','black-market.js?v=BM2','black-market.js?v=prices-BP1')
          migrations=list(Path('supabase/migrations').glob('*_black_market_prices_bp1.sql'));assert len(migrations)==1
          migrations[0].write_text('''-- BP1: rare 30 essence, epic 50 essence; common 5 and uncommon 15 unchanged.
          -- Apply after the existing black-market foundation. No player balance,
          -- receipt, purchase limit, item attribute, rarity chance or rotation is reset.
          set local lock_timeout='5s';
          set local statement_timeout='15s';
          do $bp1$
          declare f oid:=to_regprocedure('ringu_private.black_market_current()');
           definition text; old_price text:='price:=(array[5,15,50,100])[r+1];';
           new_price text:='price:=(array[5,15,30,50])[r+1];'; cutoff timestamptz;
          begin
           perform pg_advisory_xact_lock(70909,10);
           cutoff:=clock_timestamp();
           if f is null then raise exception 'BP1_MARKET_NOT_INSTALLED';end if;
           definition:=pg_get_functiondef(f);
           if strpos(definition,old_price)>0 then
            if (length(definition)-length(replace(definition,old_price,'')))/length(old_price)<>1
             or strpos(definition,new_price)>0 then raise exception 'BP1_SOURCE_CHANGED';end if;
            execute replace(definition,old_price,new_price);
           elsif strpos(definition,new_price)=0 then raise exception 'BP1_SOURCE_CHANGED';end if;
           if strpos(pg_get_functiondef(f),new_price)=0 then raise exception 'BP1_VERIFY_FAILED';end if;
           -- Keep 100 valid for historical receipts; allow the new 30-essence debit.
           alter table ringu_private.black_market_purchases
            drop constraint black_market_purchases_price_check,
            add constraint black_market_purchases_price_check check(price in (5,15,30,50,100));
           -- Preserve each existing offer and its slot; never reroll or restore purchases.
           update ringu_private.black_market_cycles c
           set offers=(select jsonb_agg(case o.value#>>'{item,rarity}'
             when '2' then jsonb_set(o.value,'{price}','30'::jsonb)
             when '3' then jsonb_set(o.value,'{price}','50'::jsonb)
             else o.value end order by o.ordinality)
            from jsonb_array_elements(c.offers) with ordinality o(value,ordinality))
           where c.ends_at>cutoff and exists(select 1 from jsonb_array_elements(c.offers) o
            where (o#>>'{item,rarity}'='2' and o->'price' is distinct from '30'::jsonb)
               or (o#>>'{item,rarity}'='3' and o->'price' is distinct from '50'::jsonb));
          end $bp1$;
          ''')
          p=Path('test/black-market-db.test.mjs');s=p.read_text()
          s=s.replace('readFile,mkdtemp,rm','readFile,readdir,mkdtemp,rm',1)
          anchor='const dir=await mkdtemp'
          s=s.replace(anchor,"const migrationDir=new URL('../supabase/migrations/',import.meta.url);\nconst migrationNames=(await readdir(migrationDir)).filter(n=>n.endsWith('_black_market_prices_bp1.sql'));assert.equal(migrationNames.length,1);\nconst priceMigration=await readFile(new URL(migrationNames[0],migrationDir),'utf8');\n"+anchor,1)
          anchor=' for(let r=0;r<4;r++){'
          assert s.count(anchor)==1
          extra=r'''
           // BP1 fixtures are isolated: test old receipts, current offers and completed rotations.
           await db.exec('begin');
           const legacy=await call();
           const offers=[0,1,2,3,0].map((rarity,slot)=>({slot,price:[5,15,50,100][rarity],item:{...balance.gear.find(it=>it.rarity===rarity),enhance:0,transcend:0,optionRolls:[.95,1.05]}}));
           await db.query('update ringu_private.black_market_cycles set offers=$1 where id=$2',[JSON.stringify(offers),legacy.rotation]);
           await db.query("insert into ringu_private.black_market_cycles(id,starts_at,ends_at,offers,rates) values('2000-01-01/00','2000-01-01T00:00:00Z','2000-01-01T18:00:00Z',$1,$2)",[JSON.stringify(offers),JSON.stringify(legacy.rates)]);
           const oldEpicId=randomUUID(),oldRareId=randomUUID();
           const oldEpic=await call('buy',legacy.rotation,3,oldEpicId);same(oldEpic.price,100);
           await identify(B);const oldRare=await call('buy',legacy.rotation,2,oldRareId);same(oldRare.price,50);
           const receipts=await db.query('select * from ringu_private.black_market_purchases order by account_id,slot');
           const beforeA=await state(A),beforeB=await state(B);
           const aclBefore=await db.query("select proacl::text,prosecdef,proconfig from pg_proc where oid='ringu_private.black_market_current()'::regprocedure");
           await db.exec(priceMigration);
           const after=await call();same(after.items.map(o=>o.price),[5,15,30,50,5]);
           same(after.items.map(o=>o.item),offers.map(o=>o.item),'migration cannot reroll items');
           same(after.rotation,legacy.rotation);same(after.rates,legacy.rates);same(after.expiresAt,legacy.expiresAt);
           same((await db.query("select offers from ringu_private.black_market_cycles where id='2000-01-01/00'")).rows[0].offers,offers,'expired offers preserved');
           same((await db.query('select * from ringu_private.black_market_purchases order by account_id,slot')).rows,receipts.rows,'old receipts preserved');
           same(await state(A),beforeA);same(await state(B),beforeB);
           same((await db.query("select proacl::text,prosecdef,proconfig from pg_proc where oid='ringu_private.black_market_current()'::regprocedure")).rows,aclBefore.rows,'permissions unchanged');
           same(await call('buy',legacy.rotation,2,oldRareId),oldRare,'old rare receipt replays without refund');
           const newEpic=await call('buy',legacy.rotation,3,randomUUID());same(newEpic.price,50);same((await state(B)).essence,beforeB.essence-50);
           await identify(A);same(await call('buy',legacy.rotation,3,oldEpicId),oldEpic,'old epic receipt still records 100');
           await db.exec('savepoint bp1_duplicate');
           await reject(call('buy',legacy.rotation,3,randomUUID()),/BLACK_MARKET_PURCHASED/);
           await db.exec('rollback to savepoint bp1_duplicate');
           const newRare=await call('buy',legacy.rotation,2,randomUUID());same(newRare.price,30);same((await state(A)).essence,beforeA.essence-30);
           const snapshot=await call();await db.exec(priceMigration);same((await call()).items,snapshot.items,'migration idempotent');
           await db.exec('rollback');
           await db.exec('begin;'+priceMigration+'commit;');
           await identify(A);
          '''
          s=s.replace('[5,15,50,100][r]','[5,15,30,50][r]')
          s=s.replace(anchor,extra+'\n'+anchor,1)
          s=s.replace('PASS BM2 PostgreSQL:','PASS BP1 PostgreSQL:')
          p.write_text(s)
          p=Path('BLACK-MARKET-ROLLOUT.md');s=p.read_text();p.write_text(s+'\n\n## BP1 price update\nCurrent prices: common 5, uncommon 15, rare 30, epic 50 essence. Apply the CLI-generated `supabase/migrations/*_black_market_prices_bp1.sql` after the existing foundation migrations. This updates the generator and unexpired offers only; completed purchases retain their original prices and cannot be bought twice. Historical 100-essence receipts remain valid. The old foundation migration is intentionally immutable.\n')
          print('MIGRATION',migrations[0]);print(migrations[0].read_text())
          PY
      - name: Test real SQL purchase debits and existing regressions with synthetic accounts
        env:
          QA_PGLITE_MODULE: ${{ runner.temp }}/bp1-qa/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node --check black-market.js
          node --check test/black-market-db.test.mjs
          node test/black-market-db.test.mjs
          node --test test/economy.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs
          node --input-type=module -e "import{readFileSync as r}from'node:fs';import assert from'node:assert/strict';assert.ok(r('black-market.js','utf8').includes('[5,15,30,50][i]'));assert.ok(r('index.html','utf8').includes('black-market.js?v=prices-BP1'));console.log('PASS browser price table and cache version')"
      - name: Commit only tested changes to the isolated branch
        run: |
          test "$(git branch --show-current)" = 'fix/black-market-prices-BP1-20260911'
          git rm -- .github/workflows/black-market-prices-bp1.yml
          git add -- black-market.js index.html BLACK-MARKET-ROLLOUT.md test/black-market-db.test.mjs supabase/migrations/*_black_market_prices_bp1.sql
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: price black-market rare at 30 and epic at 50 essence'
          git push origin HEAD:refs/heads/fix/black-market-prices-BP1-20260911
          git rev-parse HEAD
