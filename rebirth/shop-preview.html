<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>링구 RPG · 상점 카테고리 미리보기</title>
<link rel="stylesheet" href="style.css?v=field-fragment-13"><link rel="stylesheet" href="fantasy-theme.css?v=fantasy-76"><link rel="stylesheet" href="shop.css?v=shop-tabs-122"><link rel="stylesheet" href="costumes.css?v=shop-four-123">
<div class="shell fantasy-shell"><p class="note">상점 미리보기 · 구매와 판매는 게임 안에서 이용하세요.</p><main class="fantasy-content" data-screen="shop"></main></div>
<script type="module">
import {shopView} from './shop-ui.mjs?v=shop-tabs-122';
const main=document.querySelector('main'),state={items:[],costumes:[],classId:'warrior'};
function render(category='boss'){
 main.innerHTML=shopView(state,{},()=>'',category);
 main.querySelectorAll('button:not([data-action="shopCategory"])').forEach(b=>b.disabled=true);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="shopCategory"]');if(b)render(b.dataset.arg);});
render();
</script></html>
