      - name: Commit tested login changes on diagnostic branch, not main
        run: |
          git rm -- .github/workflows/login-li2-diagnostics.yml .github/workflows/login-li2-validate.yml
          git add -- cloud-adapter.js auth-client.mjs login.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reduce login waits and show bounded stage-specific connection errors'
