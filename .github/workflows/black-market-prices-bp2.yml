name: Validate black market prices BP2
on:
  push:
    branches: [fix/black-market-prices-BP2-20260911]
    paths: [.github/workflows/black-market-prices-bp2.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned isolated QA libraries and migration CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/bp2-qa" --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.5.8
          npm install --prefix "$RUNNER_TEMP/bp2-cli" --no-audit --no-fund --no-save supabase@2.81.3
          "$RUNNER_TEMP/bp2-cli/node_modules/.bin/supabase" migration new --help
          "$RUNNER_TEMP/bp2-cli/node_modules/.bin/supabase" migration new black_market_prices_bp2
      - name: Prepare price-only changes, preserving pending auction UI work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def change(name,a,b):
              p=Path(name);s=p.read_text();assert s.count(a)==1,(name,a);p.write_text(s.replace(a,b,1))
          for name,sha in {'black-market.js':'74ebe6b2d2ff38b9e7c14e568509d2c9883517a5','test/black-market-db.test.mjs':'b02356d3f4fdf10ac326d0164c05e580ca000864'}.items():
              b=Path(name).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,name
          change('black-market.js','[5,15,30,50][i]','[3,5,10,15][i]')
          change('black-market.js','암시장 BP1','암시장 BP2')
          change('black-market.js',"version:'BP1'","version:'BP2'")
          change('index.html','black-market.js?v=prices-BP1','black-market.js?v=prices-BP2')
          paths=list(Path('supabase/migrations').glob('*_black_market_prices_bp2.sql'));assert len(paths)==1
          paths[0].write_text('''-- BP2: common 3, uncommon 5, rare 10, epic 15 essence.
          -- Apply after BP1. Preserve items, rotations, rates, limits and all receipts.
          set local lock_timeout='5s';
          set local statement_timeout='15s';
          do $bp2$
          declare f oid:=to_regprocedure('ringu_private.black_market_current()');
           definition text; old_price text:='price:=(array[5,15,30,50])[r+1];';
           new_price text:='price:=(array[3,5,10,15])[r+1];'; cutoff timestamptz;
          begin
           perform pg_advisory_xact_lock(70909,10);
           cutoff:=clock_timestamp();
           if f is null then raise exception 'BP2_MARKET_NOT_INSTALLED';end if;
           definition:=pg_get_functiondef(f);
           if strpos(definition,old_price)>0 then
            if (length(definition)-length(replace(definition,old_price,'')))/length(old_price)<>1
             or strpos(definition,new_price)>0 then raise exception 'BP2_SOURCE_CHANGED';end if;
            execute replace(definition,old_price,new_price);
           elsif strpos(definition,new_price)=0 then raise exception 'BP2_SOURCE_CHANGED';end if;
           if strpos(pg_get_functiondef(f),new_price)=0 then raise exception 'BP2_VERIFY_FAILED';end if;
           -- Include both new prices and all historical receipt prices. Never refund or replay a debit.
           alter table ringu_private.black_market_purchases
            drop constraint black_market_purchases_price_check,
            add constraint black_market_purchases_price_check check(price in (3,5,10,15,30,50,100));
           -- Update prices in the current/unexpired rotations, retaining slot and item identity.
           update ringu_private.black_market_cycles c
           set offers=(select jsonb_agg(case o.value#>>'{item,rarity}'
             when '0' then jsonb_set(o.value,'{price}','3'::jsonb)
             when '1' then jsonb_set(o.value,'{price}','5'::jsonb)
             when '2' then jsonb_set(o.value,'{price}','10'::jsonb)
             when '3' then jsonb_set(o.value,'{price}','15'::jsonb)
             else o.value end order by o.ordinality)
            from jsonb_array_elements(c.offers) with ordinality o(value,ordinality))
           where c.ends_at>cutoff and exists(select 1 from jsonb_array_elements(c.offers) o
            where (o#>>'{item,rarity}'='0' and o->'price' is distinct from '3'::jsonb)
               or (o#>>'{item,rarity}'='1' and o->'price' is distinct from '5'::jsonb)
               or (o#>>'{item,rarity}'='2' and o->'price' is distinct from '10'::jsonb)
               or (o#>>'{item,rarity}'='3' and o->'price' is distinct from '15'::jsonb));
          end $bp2$;
          ''')
          p=Path('test/black-market-db.test.mjs');s=p.read_text()
          anchor="const priceMigration=await readFile(new URL(migrationNames[0],migrationDir),'utf8');";assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"\nconst bp2Names=(await readdir(migrationDir)).filter(n=>n.endsWith('_black_market_prices_bp2.sql'));assert.equal(bp2Names.length,1);\nconst bp2Migration=await readFile(new URL(bp2Names[0],migrationDir),'utf8');",1)
          anchor=' for(let r=0;r<4;r++){';assert s.count(anchor)==1
          extra=r'''
           // BP2 migration on a populated BP1 rotation, isolated from the live service.
           {
            await db.exec('begin');await identify(A);
            const old=await call(),oldPrices=[5,15,30,50],newPrices=[3,5,10,15];
            const mixed=[0,1,2,3,0].map((rarity,slot)=>({slot,price:oldPrices[rarity],item:{...balance.gear.find(it=>it.rarity===rarity),enhance:0,transcend:0,optionRolls:[.876,1.12]}}));
            await db.query('update ringu_private.black_market_cycles set offers=$1 where id=$2',[JSON.stringify(mixed),old.rotation]);
            await db.query("insert into ringu_private.black_market_cycles(id,starts_at,ends_at,offers,rates) values('2001-01-01/00','2001-01-01T00:00:00Z','2001-01-01T18:00:00Z',$1,$2)",[JSON.stringify(mixed),JSON.stringify(old.rates)]);
            const requestIds=Array.from({length:4},randomUUID),previousReceipts=[];
            for(let r=0;r<4;r++){const receipt=await call('buy',old.rotation,r,requestIds[r]);same(receipt.price,oldPrices[r]);previousReceipts.push(receipt);}
            const beforeStates=await Promise.all(players.map(state));
            const beforePurchases=(await db.query('select * from ringu_private.black_market_purchases order by account_id,slot')).rows;
            const beforeCycles=(await db.query('select * from ringu_private.black_market_cycles order by id')).rows;
            const beforeFunctions=(await db.query("select oid::text,proacl::text,prosecdef,proconfig from pg_proc where oid in ('ringu_private.black_market_current()'::regprocedure,'public.ringu_black_market(text,text,integer,uuid)'::regprocedure) order by oid")).rows;
            await db.exec(bp2Migration);
            const current=await call();same(current.items.map(x=>x.price),[3,5,10,15,3]);
            same(current.items.map(x=>x.item),mixed.map(x=>x.item),'no reroll');
            same(current.rotation,old.rotation);same(current.rates,old.rates);same(current.expiresAt,old.expiresAt);
            same(current.items.slice(0,4).map(x=>x.purchased),[true,true,true,true],'purchased slots stay purchased');
            same(await Promise.all(players.map(state)),beforeStates,'no refunds or inventory changes');
            same((await db.query('select * from ringu_private.black_market_purchases order by account_id,slot')).rows,beforePurchases,'old receipt prices preserved');
            same((await db.query("select offers from ringu_private.black_market_cycles where id='2001-01-01/00'")).rows[0].offers,mixed,'expired rotation unchanged');
            same((await db.query('select * from ringu_private.black_market_cycles order by id')).rows.map(({offers,...rest})=>rest),beforeCycles.map(({offers,...rest})=>rest),'rotation data unchanged');
            same((await db.query("select oid::text,proacl::text,prosecdef,proconfig from pg_proc where oid in ('ringu_private.black_market_current()'::regprocedure,'public.ringu_black_market(text,text,integer,uuid)'::regprocedure) order by oid")).rows,beforeFunctions,'permissions unchanged');
            for(let r=0;r<4;r++)same(await call('buy',old.rotation,r,requestIds[r]),previousReceipts[r],'historical receipt replay');
            await db.exec('savepoint bp2_duplicate');await reject(call('buy',old.rotation,0,randomUUID()),/BLACK_MARKET_PURCHASED/);await db.exec('rollback to savepoint bp2_duplicate');
            await identify(B);let expectedEssence=(await state(B)).essence;
            for(let r=0;r<4;r++){const purchased=await call('buy',old.rotation,r,randomUUID());same(purchased.price,newPrices[r]);expectedEssence-=newPrices[r];same((await state(B)).essence,expectedEssence,'new exact debit');}
            const afterState=await state(B),afterItems=(await call()).items;
            await db.exec(bp2Migration);same((await call()).items,afterItems,'repeat migration stable');same(await state(B),afterState);
            await db.exec('rollback');
           }
           await db.exec('begin;'+bp2Migration+'commit;');await identify(A);
          '''
          assert s.count('[5,15,30,50][r]')==2
          s=s.replace('[5,15,30,50][r]','[3,5,10,15][r]').replace(anchor,extra+'\n'+anchor,1)
          s=s.replace('PASS BP1 PostgreSQL:','PASS BP2 PostgreSQL:');p.write_text(s)
          p=Path('BLACK-MARKET-ROLLOUT.md');p.write_text(p.read_text()+'\n\n## BP2 current prices\n일반 정수 3개 / 희귀 정수 5개 / 레어 정수 10개 / 에픽 정수 15개.\nApply the CLI-generated `supabase/migrations/*_black_market_prices_bp2.sql` after BP1. Existing unexpired offers use these prices too; item attributes, rotation times, odds, purchase limits and completed purchases are preserved. No retrospective refund. Auction UI changes remain on their separate branch and are not part of this price-only release.\n')
          print('MIGRATION',paths[0]);print(paths[0].read_text())
          PY
      - name: Validate real SQL debit amounts and preserved gameplay
        env:
          QA_PGLITE_MODULE: ${{ runner.temp }}/bp2-qa/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node --check black-market.js
          node --check test/black-market-db.test.mjs
          node test/black-market-db.test.mjs
          node --test test/economy.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs
          node --input-type=module -e "import{readFileSync as r}from'node:fs';import assert from'node:assert/strict';assert.ok(r('black-market.js','utf8').includes('[3,5,10,15][i]'));assert.ok(r('index.html','utf8').includes('black-market.js?v=prices-BP2'));console.log('PASS new displayed prices and cache version')"
      - name: Commit only validated price changes to the isolated branch
        run: |
          test "$(git branch --show-current)" = 'fix/black-market-prices-BP2-20260911'
          git rm -- .github/workflows/black-market-prices-bp2.yml
          git add -- black-market.js index.html BLACK-MARKET-ROLLOUT.md test/black-market-db.test.mjs supabase/migrations/*_black_market_prices_bp2.sql
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: black-market prices common 3 uncommon 5 rare 10 epic 15 essence'
          git push origin HEAD:refs/heads/fix/black-market-prices-BP2-20260911
          git rev-parse HEAD
          sha256sum black-market.js index.html supabase/migrations/*_black_market_prices_bp2.sql
