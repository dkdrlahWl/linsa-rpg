<script type="module">
import {COSTUMES} from './costumes.mjs?v=dark-costumes-20261102';
import {TowerRenderer,image} from './tower-renderer.mjs?v=dark-costumes-20261102';
const names={warrior:'전사',mage:'마법사',archer:'궁수',rogue:'도적',pirate:'해적',priest:'사제'};
const list=COSTUMES.filter(c=>c.collection==='atelier-20261105'),actors=[];let mode='walk',dir=1;
for(const c of list){const card=document.createElement('article');card.innerHTML=`<h2>${c.name}</h2><small>${names[c.classId]} 전용</small><img src="${c.portrait}" alt="${c.name}"><canvas width="560" height="460"></canvas><strong>50,000,000 G</strong>`;document.querySelector('main').append(card);const canvas=card.querySelector('canvas'),r=Object.create(TowerRenderer.prototype);r.g=canvas.getContext('2d');r.mobileActors={matches:false};actors.push({c,canvas,r});}

document.querySelector('#modes').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;for(const b of document.querySelectorAll('[data-mode]'))b.classList.toggle('on',b.dataset.mode===mode);};document.querySelector('#turn').onclick=()=>dir=(dir+1)%8;
