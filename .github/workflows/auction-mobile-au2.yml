name: Validate auction mobile details AU2
on:
  push:
    branches: [fix/auction-mobile-AU2-20260911]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prepare exact versioned assets and previous-page comparison
        run: |
          mkdir -p "$RUNNER_TEMP/au2-before"
          for name in index.html auction.js auction.css; do git show 720dea37b8a5f3e0e163fded6411e681e9398c16:"$name" > "$RUNNER_TEMP/au2-before/$name"; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html');b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='5b09b93e695f2cb22a38c9cf1351176c71ee6669'
          s=b.decode()
          for a,z in [('auction.css?v=1','auction.css?v=mobile-details-AU2'),('auction.js?v=listing-limit-AL8','auction.js?v=mobile-details-AU2')]:
            assert s.count(a)==1;s=s.replace(a,z,1)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1e45a0ffba5b2b3c786f09fb51314a5720154cf0e2eb290bee130ccb69bb47c4'
          PY
      - name: Install pinned browser dependencies without package lifecycle scripts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
      - name: Syntax and unchanged gameplay regressions
        run: |
          node --check auction.js
          node --check test/auction-mobile-ui.test.mjs
          node --test test/economy.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs test/tower-hp-restored.test.mjs test/auction-db.test.mjs test/black-market-db.test.mjs
      - name: Reproduce original mobile overlay with synthetic listings
        env:
          QA_PHASE: before
          QA_BEFORE_DIR: ${{ runner.temp }}/au2-before
        run: node test/auction-mobile-ui.test.mjs
      - name: Verify new mobile desktop stats sorting and navigation
        run: node test/auction-mobile-ui.test.mjs
      - name: Commit validated page versions to the isolated branch only
        run: |
          test "$(git branch --show-current)" = 'fix/auction-mobile-AU2-20260911'
          git rm -- .github/workflows/auction-mobile-au2.yml
          git add -- index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: version verified mobile auction UI with full stats and enhancement-first sorting'
          git push origin HEAD:refs/heads/fix/auction-mobile-AU2-20260911
          git rev-parse HEAD
          sha256sum auction.js auction.css index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auction-AU2-qa
          path: test-output/auction-AU2/
          retention-days: 1
