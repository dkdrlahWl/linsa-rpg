<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>링구 RPG · 사냥터 이미지 도감</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a29;color:#e8eef6;font:15px system-ui,sans-serif}header{padding:24px;max-width:1500px;margin:auto}h1{margin:0 0 10px}p{color:#bbcbdc}.items{display:flex;gap:14px;flex-wrap:wrap}.item{text-align:center;padding:12px;border:1px solid #50657c;border-radius:12px;background:#1b2a3f}.item img{display:block;width:100px;height:100px;object-fit:contain}.world{max-width:1500px;margin:0 auto;padding:16px 24px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{overflow:hidden;border-radius:14px;border:1px solid #53657c;background:#19283b}.scene{position:relative;aspect-ratio:3/2}.scene>.bg{width:100%;height:100%;object-fit:cover}.creatures{position:absolute;inset:25% 5% 2%;display:flex;justify-content:center;align-items:end;gap:10px}.creatures img{min-width:0;max-width:48%;height:95%;object-fit:contain;filter:drop-shadow(0 6px 5px #0007)}.caption{padding:12px}.caption small{color:#b9cbe1;display:block;margin-top:5px}.broken{outline:4px solid #ff5766}
</style><header><h1>사냥터 이미지 도감</h1><p>21개 지역 · 63개 사냥터 · 몬스터 93종</p><div class="items" id="items"></div></header><main id="worlds"></main><script type="module">
import * as D from './data.mjs';import {applyFieldArt} from './field-art.mjs';applyFieldArt(D);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const itemRows=[['열쇠던전','ui/top-buttons/key-v1.webp'],['토큰던전','ui/top-buttons/token-v1.webp'],['초월석','currencies/transcend-stone-v1.webp'],['철쇄 열쇠지기 카르둠','tower/boss-keykeeper-v1.webp']];
document.querySelector('#items').innerHTML=itemRows.map(([name,src])=>`<div class="item"><img src="${src}" alt="${name}">${name}</div>`).join('');
document.querySelector('#worlds').innerHTML=D.REGIONS.map(r=>`<section class="world"><h2>${esc(r.name)}</h2><div class="fields">${D.STAGES.filter(s=>s.region===r.id).map(s=>`<article class="card"><div class="scene"><img class="bg" src="${s.background}" alt="${esc(s.name)} 배경" loading="lazy"><div class="creatures">${D.MONSTERS.filter(m=>m.stage===s.id).map(m=>`<img src="${m.art}" alt="${esc(m.name)}" loading="lazy">`).join('')}</div></div><div class="caption"><b>Lv.${s.level} · ${esc(s.name)}</b><small>${D.MONSTERS.filter(m=>m.stage===s.id).map(m=>esc(m.name)).join(' · ')}</small></div></article>`).join('')}</div></section>`).join('');
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.classList.add('broken')},true);
</script></html>
