name: Validate login and inventory LI1
on:
  push:
    branches: [fix/login-inventory-LI1-20260910]
    paths: [.github/workflows/login-inventory-li1.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact locally tested source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          changes=json.loads(Path('maintenance/login-inventory-patch.json').read_text())
          for name,patch in changes.items():
              path=Path(name);original=path.read_bytes()
              assert blob(original)==patch['before'], 'Source changed: '+name
              text=original.decode('utf-8')
              for before,after in patch['changes']:
                  assert text.count(before)==1, 'Ambiguous patch: '+name
                  text=text.replace(before,after,1)
              result=text.encode('utf-8')
              assert blob(result)==patch['after'], 'Not locally tested output: '+name
              path.write_bytes(result)
          print('PASS: all five files match the locally tested output')
          PY
      - name: Validate executable scripts and unchanged embedded images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,tempfile,subprocess
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__();self.active=False;self.parts=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      a=dict(attrs);self.active=not a.get('src') and a.get('type','').lower() in ('','module','text/javascript','application/javascript');self.parts=[]
              def handle_data(self,s):
                  if self.active:self.parts.append(s)
              def handle_endtag(self,tag):
                  if tag=='script' and self.active:self.scripts.append(''.join(self.parts));self.active=False
          text=Path('index.html').read_text(encoding='utf-8-sig')
          before=subprocess.check_output(['git','show','HEAD:index.html']).decode('utf-8-sig')
          assert re.findall(r'data:image/[^\s\"\x27]+',before)==re.findall(r'data:image/[^\s\"\x27]+',text)
          parser=Scripts();parser.feed(text)
          with tempfile.TemporaryDirectory() as tmp:
              for i,code in enumerate(parser.scripts):
                  path=Path(tmp)/f'script-{i}.js';path.write_text(code)
                  subprocess.run(['node','--check',str(path)],check=True)
              for path in [*Path('.').glob('*.js'),Path('auth-client.mjs')]:
                  subprocess.run(['node','--check',str(path)],check=True)
          print('PASS: syntax and unchanged embedded artwork')
          PY
      - name: Exercise actual session bridge with fake network and storage
        run: node test/login-inventory.test.mjs
      - name: Run existing isolated economy, costume and pet regressions
        run: node --test test/economy.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs
      - name: Commit verified source only to isolated fix branch
        run: |
          git rm -- maintenance/login-inventory-patch.json .github/workflows/login-inventory-li1.yml
          git add -- index.html cloud-adapter.js safety.js auth-client.mjs login.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: avoid login self-conflict and paginate large equipment inventories'
          git push origin HEAD:refs/heads/fix/login-inventory-LI1-20260910
