<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5차 스킬 연출 확인</title><style>body{margin:0;background:#0c1420;color:#ece3cc;font:14px system-ui}header{display:flex;gap:8px;flex-wrap:wrap;padding:12px;align-items:center}button{background:#223148;color:#fff;border:1px solid #7585a0;border-radius:7px;padding:10px}button.active{border-color:#ffdc79;color:#ffdc79}canvas{display:block;width:min(100%,660px);height:calc(100dvh - 135px);margin:auto;max-height:880px}#status{padding:0 12px;color:#c8b9e9}</style></head><body><header><strong>200레벨 · 5차 연출</strong><button data-class="warrior">전사</button><button data-class="mage">마법사</button><button data-class="archer">궁수</button><button data-class="rogue">도적</button><button data-class="pirate">해적</button><button id="cast">스킬 다시 사용</button><button id="eight">8명 동시 사용</button></header><p id="status">이미지 준비 중…</p><canvas width="720" height="1000"></canvas><script type="module">
import {TowerRenderer,prepareCombatArt,image} from './tower-renderer.mjs?v=fifth-114';
import {newTowerBattle,towerStep} from './tower-model.mjs?v=fifth-114';
import {ADVANCEMENT_BOSSES} from './advancement.mjs?v=fifth-114';
import {beginFifth,stepFifth,boundedCombatEffects,FIFTH_SKILLS} from './fifth-job.mjs?v=fifth-114';
const classes=['warrior','mage','archer','rogue','pirate'],P={level:200,advancement:4,firstJob:true,attack:100,hp:1e8,defense:1000,boss:1,crit:0,critDamage:1,cadence:1},canvas=document.querySelector('canvas'),r=new TowerRenderer(canvas),status=document.querySelector('#status');let b,cls='warrior',party=false,last=0,acc=0,frames=0,total=0,peak=0;
await prepareCombatArt(classes,'astrael');await Promise.all(['arena-overhead-v3','attack-slash-v2','attack-burst-v2'].map(n=>image('tower/'+n+'.png').decode().catch(()=>{})));
function reset(){b=newTowerBattle(10,cls,P,performance.now(),'preview',1,true);Object.assign(b,{advancementStage:4,encounter:ADVANCEMENT_BOSSES[4],enemyHp:18000000,nextPattern:1e9});r.camera=null;last=0;acc=0;frames=total=peak=0;document.querySelectorAll('[data-class]').forEach(el=>el.classList.toggle('active',el.dataset.class===cls));if(party){b.allies=Array.from({length:7},(_,i)=>({id:'ally'+i,classId:classes[i%5],x:1300+i*80,y:1850,power:P,hp:P.hp,dir:6,walk:0}));for(const a of b.allies)beginFifth(a,b.enemy,0);}status.textContent=FIFTH_SKILLS[cls].name+' · '+FIFTH_SKILLS[cls].description;}
document.querySelectorAll('[data-class]').forEach(el=>el.onclick=()=>{cls=el.dataset.class;party=false;reset();});document.querySelector('#cast').onclick=()=>{party=false;reset();};document.querySelector('#eight').onclick=()=>{party=true;reset();};reset();
function frame(now){requestAnimationFrame(frame);if(!last)last=now;acc+=Math.min(100,now-last);last=now;while(acc>=100){towerStep(b,[0,0,b.tick===0?64:0]);for(const a of b.allies||[])stepFifth(a,[{...b.enemy,hp:b.enemyHp,maxHp:18000000}],b.tick,()=>{},e=>b.effects.push({...e,id:++b.serial}));b.effects=boundedCombatEffects(b.effects,b.tick,70);acc-=100;}const start=performance.now();r.draw(b,{enemy:b.enemy,projectiles:b.projectiles},b.player,acc/100,now,[0,0,0],{});const ms=performance.now()-start;frames++;total+=ms;peak=Math.max(peak,ms);if(frames%60===0)status.textContent=FIFTH_SKILLS[cls].name+' · '+(party?'8명 동시':'1명')+' · 평균 렌더 '+(total/frames).toFixed(1)+'ms · 최대 '+peak.toFixed(1)+'ms';if(b.tick>110)reset();}requestAnimationFrame(frame);
</script></body></html>
