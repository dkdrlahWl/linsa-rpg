name: Ringgu exploration checks
on:
  push:
    paths:
      - 'rebirth/**'
      - '.github/workflows/exploration-check.yml'
  pull_request:
    paths:
      - 'rebirth/**'
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node rebirth/sovereign-expansion.test.mjs --assets
      - run: node rebirth/costume-motion.test.mjs
      - run: node rebirth/costume-ownership.test.mjs
      - run: node rebirth/approved-costumes-20261025.test.mjs
      - run: node rebirth/costume30m.test.mjs
      - run: node rebirth/skill-looks.test.mjs
      - run: node rebirth/skill-look-native.test.mjs
      - run: node rebirth/skill-look-bounds.test.mjs
      - run: node rebirth/skill-look-orientation.test.mjs
      - run: node rebirth/skill-look-designs.test.mjs
      - run: node rebirth/actor-facing.test.mjs
      - run: node rebirth/endgame-field.test.mjs
      - run: node rebirth/apex-tower.test.mjs
      - run: node rebirth/upper-tower.test.mjs
      - run: node rebirth/post-clear-movement.test.mjs
      - run: node rebirth/potential-unlock.test.mjs
      - run: node rebirth/cube-bulk-buy.test.mjs
      - run: node rebirth/black-market.test.mjs
      - run: node rebirth/exploration-arena.test.mjs
      - run: node rebirth/cube-layout.test.mjs
      - run: node rebirth/exploration-rewards-admin.test.mjs
      - run: node rebirth/exploration.test.mjs
      - run: node rebirth/exploration-dungeon.test.mjs
      - run: node rebirth/exploration-pickups.test.mjs
      - run: node rebirth/citadel-path.test.mjs
      - run: node rebirth/citadel-zero.test.mjs
      - run: node rebirth/citadel-balance.test.mjs
      - run: node rebirth/citadel-latency.test.mjs
      - run: node rebirth/citadel-clock-resume.test.mjs
      - run: node rebirth/citadel-claim-recovery.test.mjs
      - run: node rebirth/boss200-art.test.mjs --assets
      - run: node rebirth/coop-request-lifecycle.test.mjs
      - run: node rebirth/coop-worker.test.mjs
      - run: node rebirth/raid-latency.test.mjs
