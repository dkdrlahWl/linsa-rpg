<style>
/* Compact cube controls keep the result and next roll together on phones. */
.enhance-dialog .cube-compact .enhance-intro{display:none}
.enhance-dialog .cube-compact .enhance-result{padding:6px 9px;margin-bottom:7px;font-size:11px}
.enhance-dialog .cube-compact .option-panel{margin-bottom:8px}
.enhance-dialog .cube-compact .option-heading{padding:6px 10px}
.enhance-dialog .cube-compact .option-line{min-height:34px;padding:6px 0}
.enhance-dialog .cube-compact .line-grade{display:inline;margin:0 6px 0 0;font-size:10px}
.enhance-dialog .cube-compact .maple-cube-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.enhance-dialog .cube-compact .cube-card,.enhance-dialog .cube-compact .cube-card.selected{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px 3px;min-height:76px;margin:0;min-width:0;border-width:2px}
.enhance-dialog .cube-compact .cube-card .cube-item-art{width:28px!important;height:28px!important;min-width:0;object-fit:contain;margin:0}
.enhance-dialog .cube-compact .cube-card>span{gap:2px;text-align:center}
.enhance-dialog .cube-compact .cube-card strong{font-size:11px;white-space:nowrap}
.enhance-dialog .cube-compact .cube-card small{display:none}
.enhance-dialog .cube-compact .cube-card b{font-size:10px}
.enhance-dialog .cube-compact .enhance-wallet{font-size:11px;margin:5px 0;padding:4px 0;border:0;text-align:center}
.enhance-dialog .cube-compact button.enhance-primary{min-height:44px;margin:0}
.enhance-dialog .cube-compact .enhance-help{font-size:10px;line-height:1.4;margin:6px 0}
.enhance-dialog .cube-extra{margin:10px 0;font-size:11px}
.enhance-dialog .cube-extra summary{padding:7px 0;cursor:pointer}
@media(max-width:600px){
.enhance-dialog:has(.cube-compact) .enhance-content{padding:10px}
.enhance-dialog:has(.cube-compact) .enhance-tabs{margin-bottom:8px;gap:3px;padding:3px}
.enhance-dialog:has(.cube-compact) .enhance-tabs button{font-size:11px;min-height:38px;padding:4px 1px}
}
