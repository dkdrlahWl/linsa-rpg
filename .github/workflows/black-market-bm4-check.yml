name: Validate noon black-market refresh BM4
on:
  push:
    branches: [fix/black-market-noon-BM4-20260911]
    paths: [.github/workflows/black-market-bm4-check.yml, test/black-market-refresh-bm4.test.mjs, maintenance/black-market-refresh-bm4.sql]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate only the noon migration and update matching display text
        run: |
          npm install --prefix "$RUNNER_TEMP/bm4-cli" --no-audit --no-fund --no-save supabase@2.81.3
          "$RUNNER_TEMP/bm4-cli/node_modules/.bin/supabase" migration new --help
          "$RUNNER_TEMP/bm4-cli/node_modules/.bin/supabase" migration new black_market_refresh_bm4
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('black-market.js');b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='e3ead2cc86796b84c93df2ef9eb4d02fc8c3412f'
          def patch(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old);p.write_text(s.replace(old,new,1))
          patch('black-market.js','매일 00:00 · 18:00 갱신 (한국시간)','매일 12:00 · 18:00 · 24:00(00:00) 갱신 (한국시간)')
          patch('black-market.js','한국시간 00시 · 18시 갱신','한국시간 12시 · 18시 · 24시(00시) 갱신')
          patch('black-market.js','암시장 BM3','암시장 BM4')
          patch('black-market.js',"version:'BM3'","version:'BM4'")
          patch('index.html','black-market.js?v=consumables-BM3','black-market.js?v=refresh-BM4')
          paths=list(Path('supabase/migrations').glob('*_black_market_refresh_bm4.sql'));assert len(paths)==1
          paths[0].write_bytes(Path('maintenance/black-market-refresh-bm4.sql').read_bytes())
          patch('test/black-market-bm3-browser.test.mjs','prices_bp[12]|consumables_bm3','prices_bp[12]|consumables_bm3|refresh_bm4')
          anchor=' const get=()=>a.evaluate(()=>'
          p=Path('test/black-market-bm3-browser.test.mjs');s=p.read_text();assert s.count(anchor)==1
          s=s.replace(anchor," assert.match(await a.locator('.bm-footer').innerText(),/12시 · 18시 · 24시/);\n assert.equal(await a.evaluate(()=>RinguBlackMarket.version),'BM4');\n"+anchor,1);p.write_text(s)
          p=Path('BLACK-MARKET-ROLLOUT.md');p.write_text(p.read_text()+'\n\n## BM4 current refresh schedule\n한국시간 매일 12시 / 18시 / 24시(00시), 하루 3회 상품 갱신.\nAdded only noon: periods 00:00–12:00, 12:00–18:00, 18:00–24:00. Existing prices, odds, five offers per period and per-account per-slot purchase rules are unchanged. The unexpired midnight rotation keeps its items and purchase records but now ends at noon. Completed historical cycles and receipts are untouched. Apply `supabase/migrations/*_black_market_refresh_bm4.sql` after BM3. This supersedes the older 00:00/18:00 schedule above.\n')
          print('MIGRATION',paths[0])
          PY
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify boundaries and preservation using fresh isolated PostgreSQL-compatible engine
        run: |
          node --check black-market.js
          node --check test/black-market-refresh-bm4.test.mjs
          node test/black-market-refresh-bm4.test.mjs
          node test/black-market-bm3.test.mjs
          node --test test/economy.test.mjs test/tower-hp-restored.test.mjs test/auction-db.test.mjs test/black-market-db.test.mjs
      - name: Verify real mobile browser text and unchanged consumable/equipment purchases
        run: QA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node test/black-market-bm3-browser.test.mjs
      - name: Commit the verified files to isolated branch only
        run: |
          test "$(git branch --show-current)" = 'fix/black-market-noon-BM4-20260911'
          git rm -- .github/workflows/black-market-bm4-check.yml maintenance/black-market-refresh-bm4.sql
          git add -- black-market.js index.html BLACK-MARKET-ROLLOUT.md test/black-market-bm3-browser.test.mjs supabase/migrations/*_black_market_refresh_bm4.sql
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: add noon to black-market refresh schedule without changing offers or prices'
          git push origin HEAD:refs/heads/fix/black-market-noon-BM4-20260911
          git rev-parse HEAD
          sha256sum black-market.js index.html supabase/migrations/*_black_market_refresh_bm4.sql
