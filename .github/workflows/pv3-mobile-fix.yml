''')
          # Cache-bust the changed assets.
          p=Path('index.html');s=p.read_text()
          for old,new in [('premium-ui-v2.js?v=PV2','premium-ui-v2.js?v=PV3'),('premium-ui-v2.css?v=PV2','premium-ui-v2.css?v=PV3')]:
