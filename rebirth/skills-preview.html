<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>린사 RPG · 스킬 미리보기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;background:#0a1017;color:#ebf1ef}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 22px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{color:#c8b580;letter-spacing:.2em;font-size:11px}h1{margin:6px 0;font-size:30px}p{color:#9bacb6;font-size:13px;line-height:1.65}button{font:inherit;cursor:pointer;border:1px solid #35434d;border-radius:10px;padding:10px 17px;background:#15212c;color:#d1ddd9}button[aria-pressed=true]{background:#c9b884;border-color:#e6d7ac;color:#16232a;font-weight:750}.classes,.actions{display:flex;gap:7px;flex-wrap:wrap}.classes{margin-bottom:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.stage{position:relative;border:1px solid #344249;border-radius:18px;overflow:hidden;background:#101923}.stage canvas{display:block;width:100%;height:560px;max-height:66vh}.stage-label{position:absolute;left:18px;bottom:16px;z-index:2;padding:7px 12px;border-radius:9px;background:#071018c9;color:#b7c9c4;font-size:12px}.details{padding:22px;border:1px solid #344249;border-radius:18px;background:linear-gradient(150deg,#1a2933,#0d1721)}h2{font-size:23px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.stats div{border-top:1px solid #35424a;padding-top:12px}.stats small{display:block;color:#91a4ae;font-size:11px}.stats strong{display:block;font-size:22px;margin-top:5px;color:#eadcac}.timeline{height:3px;background:#35424a;margin:18px 0}.timeline i{display:block;height:100%;background:#d1bd82;width:0}.actions button{flex:1}label{display:block;color:#b4c3c8;font-size:12px;margin:15px 0}footer{font-size:11px;color:#71858f;margin-top:18px}a{color:#cbb986}@media(max-width:700px){main{padding:18px 14px}header{display:block}h1{font-size:25px}.layout{grid-template-columns:1fr}.stage canvas{height:420px}.details{padding:18px}.stats{grid-template-columns:repeat(4,1fr)}.stats strong{font-size:18px}.classes button{flex:1;padding:9px 4px}.details p{margin-bottom:0}}
</style></head><body><main>
<header><div><div class="eyebrow">LINSA RPG · COMBAT ARTS</div><h1>새로운 전투의 시작</h1><p>1차의 날카로운 한 수, 2차의 이어지는 연격.</p></div><a href="./tower-preview.html">직접 조작해 보기 ↗</a></header>
<nav class="classes" aria-label="직업 선택"></nav>
<div class="layout"><div class="stage"><span class="stage-label">전용 훈련장 · 계정에 저장되지 않습니다</span><canvas id="scene" aria-label="선택한 직업의 스킬 애니메이션"></canvas></div><section class="details"><div class="actions"><button id="first" aria-pressed="false">1차</button><button id="second" aria-pressed="true">2차</button></div><h2 id="skill-name"></h2><p id="description"></p><div class="stats"><div><small>최대 피해</small><strong id="damage"></strong></div><div><small>타격 수</small><strong id="hits"></strong></div><div><small>타격 시간</small><strong id="duration"></strong></div><div><small>재사용</small><strong id="cooldown"></strong></div></div><div class="timeline"><i id="progress"></i></div><button id="replay">다시 재생</button><label><input type="checkbox" id="repeat" checked> 자동 반복</label><label id="range-label" hidden><input type="checkbox" id="close" checked> 근접 산탄까지 적중</label><p id="note"></p></section></div>
<footer>현재 게임과 같은 스킬 타격·이펙트 처리로 재생합니다. 훈련 표적은 움직이지 않습니다.</footer>
</main><script type="module">
import {newTowerBattle,towerStep} from './tower-model.mjs?v=skill-sequence-21';
import {TowerRenderer,prepareCombatArt,image,asset,motionAsset} from './tower-renderer.mjs?v=skill-sequence-21';
import {CLASS_SKILLS,SECOND_SKILLS} from './combat-skills.mjs?v=skill-sequence-21';
const classes={warrior:'전사',mage:'마법사',archer:'궁수',rogue:'도적',pirate:'해적'},$=id=>document.getElementById(id),renderer=new TowerRenderer($('scene'),{presentationScale:.9});
let classId=new URLSearchParams(location.search).get('class')||'warrior',slot=Number(new URLSearchParams(location.search).get('slot'))||2,b,previous,started=0,pausedAt=null;
if(!classes[classId])classId='warrior';slot=slot===1?1:2;
document.querySelector('.classes').innerHTML=Object.entries(classes).map(([id,name])=>`<button data-class="${id}">${name}</button>`).join('');
await Promise.all(['effects','second-job-atlas','third-job-atlas','reward-chest'].map(x=>image(asset(x)).decode().catch(()=>{})).concat(['arena-overhead-v3','second-sequence-atlas-v1','attack-slash-v2','attack-burst-v2','attack-beam-v2','attack-bolt-v2'].map(x=>image(motionAsset(x)).decode().catch(()=>{}))));
async function reset(){
 await prepareCombatArt([classId],'moss');const sk=(slot===1?CLASS_SKILLS:SECOND_SKILLS)[classId];
 b=newTowerBattle(1,classId,{attack:1000,hp:1e9,defense:1e9,boss:1,crit:0,critDamage:1,cadence:1,advancement:3,firstJob:true},0,'preview',42,true);b.enemyHp=1e9;b.nextPattern=1e9;b.encounter={name:'훈련 표적',art:'moss',seconds:3600,hp:1e9,attack:0};b.player.x=1350;b.player.y=classId==='pirate'&&!$('close').checked?2050:1780;b.enemy.x=1600;b.enemy.y=1500;
 previous={enemy:{...b.enemy},projectiles:[]};renderer.camera=null;started=performance.now();pausedAt=null;
 $('skill-name').textContent=sk.name;$('description').textContent=sk.description;$('damage').textContent=classId==='pirate'&&slot===2&&!$('close').checked?'420%':Math.round(sk.pulses.reduce((n,p)=>n+p.damage,0)*100)+'%';$('hits').textContent=(classId==='pirate'&&slot===2&&!$('close').checked?8:sk.hits)+'타';$('duration').textContent=(sk.pulses.at(-1).at/10)+'초';$('cooldown').textContent=sk.cooldown+'초';$('first').setAttribute('aria-pressed',slot===1);$('second').setAttribute('aria-pressed',slot===2);$('range-label').hidden=classId!=='pirate'||slot!==2;
 document.querySelectorAll('[data-class]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.class===classId));$('note').textContent=slot===1?'기존 2차 공격의 외형을 살린 짧고 선명한 공격입니다.':{warrior:'붉은 균열이 이어진 뒤 마지막 검기가 지면을 가릅니다.',mage:'여덟 마력창이 순서대로 날아가고, 결정이 한꺼번에 터집니다.',archer:'묵직한 저격 뒤 같은 직선 궤적으로 잔상 화살이 이어집니다.',rogue:'분신이 번갈아 교차하고, 남겨진 표식이 두 번 폭발합니다.',pirate:'산탄과 측면 탄환 뒤 화약이 두 번 폭발합니다.'}[classId];
 window.skillPreview={select:async(id,s=2)=>{classId=id;slot=s;await reset();},seek:t=>{resetTime(t);},state:()=>b};
}
function resetTime(t){pausedAt=t;while(b.tick<t){previous={enemy:{...b.enemy},projectiles:b.projectiles.map(p=>({...p}))};towerStep(b,[0,0,b.tick===0?(slot===1?8:2):0]);b.enemy.x=1600;b.enemy.y=1500;}draw(t);}
function draw(time){renderer.nextFrame=0;renderer.draw(b,previous,{...b.player},Math.max(0,time-b.tick),performance.now(),[0,0,0],{attack:0,skill:0,dash:0});$('progress').style.width=Math.min(100,time/(slot===1?16:45)*100)+'%';}
document.querySelectorAll('[data-class]').forEach(el=>el.onclick=()=>{classId=el.dataset.class;reset();});$('first').onclick=()=>{slot=1;reset();};$('second').onclick=()=>{slot=2;reset();};$('replay').onclick=reset;$('close').onchange=reset;
await reset();function loop(now){if(b&&pausedAt===null){const time=(now-started)/100;while(b.tick<Math.floor(time)){previous={enemy:{...b.enemy},projectiles:b.projectiles.map(p=>({...p}))};towerStep(b,[0,0,b.tick===0?(slot===1?8:2):0]);b.enemy.x=1600;b.enemy.y=1500;}draw(time);if(time>65&&$('repeat').checked)reset();}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
