import {ADVANCEMENT_BOSSES} from './advancement.mjs';
import {advancementPortrait} from './advancement-art.mjs';
import {TowerRenderer,prepareCombatArt,image} from './tower-renderer.mjs';
import {newTowerBattle} from './tower-model.mjs';
const canvas=document.querySelector('canvas'),poster=document.querySelector('#poster'),renderer=new TowerRenderer(canvas),mode=document.querySelector('#mode');let stage=5,b,showCombat=false;
async function select(){const t=ADVANCEMENT_BOSSES.find(t=>t.stage===stage);document.querySelector('#name').textContent=`${stage+1}차 · ${t.name}`;poster.innerHTML=advancementPortrait(t);document.querySelectorAll('[data-stage]').forEach(el=>el.classList.toggle('active',Number(el.dataset.stage)===stage));const power={level:t.level,advancement:stage-1,firstJob:true,attack:100,hp:1e8,defense:1000,boss:1,crit:0,critDamage:1,cadence:1};b=newTowerBattle(t.floor,'warrior',power,performance.now(),'art-preview',1,true);Object.assign(b,{advancementStage:stage,encounter:t,enemyHp:t.hp,nextPattern:1e9});b.player.x=1500;b.player.y=1820;b.enemy.x=1500;b.enemy.y=1450;renderer.camera=null;await prepareCombatArt(['warrior'],t.art);await image('tower/arena-overhead-v3.webp').decode().catch(()=>{});}
document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{stage=Number(el.dataset.stage);select();});mode.onclick=()=>{showCombat=!showCombat;canvas.hidden=!showCombat;poster.hidden=showCombat;mode.textContent=showCombat?'일러스트 보기':'인게임 보기';renderer.camera=null;};await select();function frame(now){requestAnimationFrame(frame);if(showCombat&&b){b.tick=Math.floor(now/100);renderer.draw(b,{enemy:b.enemy,projectiles:b.projectiles},b.player,(now%100)/100,now,[0,0,0],{});}}requestAnimationFrame(frame);
</script></body></html>
