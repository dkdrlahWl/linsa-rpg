name: Ringgu exploration checks
on:
  push:
    paths:
      - 'rebirth/**'
      - '.github/workflows/exploration-check.yml'
  pull_request:
    paths:
      - 'rebirth/**'
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node rebirth/exploration-arena.test.mjs
      - run: node rebirth/exploration-rewards-admin.test.mjs
      - run: node rebirth/exploration.test.mjs
      - run: node rebirth/exploration-dungeon.test.mjs
      - run: node rebirth/exploration-pickups.test.mjs
      - run: node rebirth/coop-worker.test.mjs
      - run: node rebirth/raid-latency.test.mjs
