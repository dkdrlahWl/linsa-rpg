name: Check auction8 and TH3
on:
  push:
    branches: [fix/auction8-tower-third-20260910]
    paths: [.github/workflows/auction8-tower-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Prepare exact versioned page and focused synthetic browser fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html');b=p.read_bytes();old=b'economy-client.js?v=linsa-shop-LS1';new=b'economy-client.js?v=tower-hp-TH3'
          assert b.count(old)==1;b=b.replace(old,new,1)
          assert hashlib.sha256(b).hexdigest()=='a97f5a67af4d3e835bdd18173131738ac83ab5367a135cbfa91d8073e7ccd250';p.write_bytes(b)
          s=Path('test/economy-browser.test.mjs').read_text();s=s[:s.index("try{\n const a=await player(")]
          s=s.replace("from '../supabase/functions/_shared/economy.mjs'","from '../supabase/functions/_shared/tower-hp-third.mjs'",1)
          old="await db.exec('update ringu_private.auction_release set economy_ready=true,enabled=true');"
          new="await db.exec('begin;\\n'+await readFile(new URL('../supabase/18-auction-listing-limit.sql',import.meta.url),'utf8')+'\\ncommit;');\n"+old
          assert s.count(old)==1;s=s.replace(old,new,1)
          old="seed.inventory=[{...balance.gear[0],id:1,enhance:3,transcend:0,optionRolls:[.876,1.12],locked:false}];"
          new="seed.inventory=Array.from({length:9},(_,i)=>({...balance.gear[0],id:i+1,enhance:3,transcend:0,optionRolls:[.876,1.12],locked:false}));"
          assert s.count(old)==1;s=s.replace(old,new,1)
          s=s.replace("await p.goto(base+'login.html');","await p.goto(base+'login.html',{waitUntil:'domcontentloaded'});",1)
          s+="""
          try{
           const a=await player('releaseqaA');
           await run(a,'auto',{enabled:false});await run(a,'unequip',{slot:'무기'});
           const displayed=await a.evaluate(()=>({version:RinguCore.towerHpVersion,hp:RinguCore.towerFloors.map(x=>x.hp)}));
           assert.equal(displayed.version,'TH3');assert.deepEqual(displayed.hp,balance.towerFloors.map(x=>x.hp));
           assert.ok(await run(a,'startDungeon',{type:'tower',stage:1}));
           const battle=await a.evaluate(()=>({max:RinguCore.activeTower.data.hp,hp:RinguCore.state.serverBattle.hp,version:RinguCore.state.serverBattle.hpVersion}));
           assert.equal(battle.max,2500);assert.ok(battle.hp>0&&battle.hp<=2500);assert.equal(battle.version,'TH3');await run(a,'cancelBattle');
           const items=await a.evaluate(()=>RinguCore.state.inventory.map(x=>x.id));assert.equal(items.length,9);
           for(const id of items.slice(0,8))await a.evaluate(itemId=>RinguSession.auctionTransaction('list',{itemId,price:7}),id);
           assert.equal((await db.query("select count(*)::int n from ringu_private.auction_listings where status='active'")).rows[0].n,8);
           const rejection=await a.evaluate(async itemId=>{try{await RinguSession.auctionTransaction('list',{itemId,price:7});return 'unexpected success';}catch(e){return e.message;}},items[8]);
           assert.match(rejection,/AUCTION_LISTING_LIMIT/);assert.equal(await a.evaluate(()=>RinguCore.state.inventory.length),1);
           await a.getByRole('button',{name:'⚖️ 경매장',exact:true}).click();
           await a.waitForFunction(()=>document.querySelector('#ringuAuction')?.textContent.includes('8 / 8'));
           const listing=(await db.query("select id from ringu_private.auction_listings where status='active' order by id limit 1")).rows[0].id;
           await a.evaluate(listingId=>RinguSession.auctionTransaction('cancel',{listingId}),listing);
           await a.evaluate(itemId=>RinguSession.auctionTransaction('list',{itemId,price:7}),items[8]);
           assert.equal((await db.query("select count(*)::int n from ringu_private.auction_listings where status='active'")).rows[0].n,8);
           assert.deepEqual(errors,[]);
           const fs=await import('node:fs/promises');await fs.mkdir('test-output',{recursive:true});
           await a.screenshot({path:'test-output/auction8-TH3.png'});
           console.log('PASS focused browser acceptance: all 30 displayed HP values, actual first-floor server fight, eight registrations, ninth rejected without item loss, visible cap counter, cancellation frees exactly one slot; zero browser errors. Synthetic accounts only. Legacy 2400-item benchmark was not rerun here.');
          }finally{await browser.close();server.close();await db.close();}
          """
          Path('test/auction8-tower-browser.test.mjs').write_text(s)
          PY
      - name: Validate focused source and existing regressions
        run: |
          node --check auction.js
          node --check economy-client.js
          node --test test/tower-hp-third.test.mjs test/economy.test.mjs test/economy-edge.test.mjs test/economy-db.test.mjs test/auction-db.test.mjs test/black-market-db.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs test/login-inventory.test.mjs test/login-recovery.test.mjs
      - name: Focused auction8 and TH3 browser acceptance
        run: node test/auction8-tower-browser.test.mjs
      - name: Commit validated assets to test branch only
        run: |
          git add -- index.html test/auction8-tower-browser.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: verify auction8 and TH3 in browser and version the release client'
          git push origin HEAD:refs/heads/fix/auction8-tower-third-20260910
          git rev-parse HEAD
          git ls-files -s auction.js index.html economy-client.js supabase/18-auction-listing-limit.sql supabase/functions/ringu-economy/index.ts supabase/functions/_shared/tower-hp-third.mjs test/tower-hp-third.test.mjs test/auction-listing-limit.test.mjs test/auction8-tower-browser.test.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auction8-TH3-browser
          retention-days: 1
          path: test-output/
