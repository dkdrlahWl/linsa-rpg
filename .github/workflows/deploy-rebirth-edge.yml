name: Deploy ringu-rebirth edge function
# Deploys rebirth/edge-dist (built by scripts/build-edge-dist.mjs) to Supabase
# whenever it changes on main. Needs the repository secret SUPABASE_ACCESS_TOKEN
# (Supabase dashboard > Account > Access Tokens).
on:
  push:
    branches: [main]
    paths:
      - 'rebirth/edge-dist/**'
      - '.github/workflows/deploy-rebirth-edge.yml'
  workflow_dispatch:
concurrency:
  group: deploy-rebirth-edge
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ekgihnyojihpearcudtd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Multiplayer server rules must pass before they reach players.
      - run: node rebirth/citadel-chest-rates.test.mjs
      - run: node rebirth/coop-wire.test.mjs
      - run: node --experimental-strip-types --no-warnings rebirth/coop-wire-edge.test.mjs
      - run: node rebirth/exploration-boss-start.test.mjs
      - run: node rebirth/exploration.test.mjs
      - run: node rebirth/exploration-arena.test.mjs
      - run: node rebirth/coop-worker.test.mjs
      - run: node rebirth/citadel-latency.test.mjs
      - run: node rebirth/raid-latency.test.mjs
      - name: Check Supabase token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Stage function
        run: |
          rm -rf supabase/functions/ringu-rebirth
          mkdir -p supabase/functions/ringu-rebirth
          cp rebirth/edge-dist/* supabase/functions/ringu-rebirth/
          mv supabase/functions/ringu-rebirth/edge.ts supabase/functions/ringu-rebirth/index.ts
      - name: Deploy
        run: supabase functions deploy ringu-rebirth --project-ref "$PROJECT_REF" --use-api
