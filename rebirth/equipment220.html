<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>220제 성좌 장비 도감</title><link rel="stylesheet" href="boss-gear.css?v=boss220-20261102"><style>body{margin:0;padding:24px;background:#0b1020;color:#efe9db;font:15px system-ui}main{max-width:1100px;margin:auto}a{color:#b6eaff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}article{padding:16px;background:#1b2236;border:1px solid #555370;border-radius:14px}.gear-frame{display:block;position:relative;width:140px;height:140px;margin:auto;border-radius:12px}.gear-icon{width:100%;height:100%;box-sizing:border-box}h3{font-size:16px}small{color:#bac5d9}p{line-height:1.7}</style><main><a href="./">게임으로</a><h1>220제 · 성좌의 왕권</h1><p>직업별 무기 6종 · 무기 5등급 / 공통 8부위 · 3등급<br>기본 성능: 같은 부위 200제 최고치의 125%~320%. 아래 수치는 0성·추가옵션 없음 기준입니다.<br>신규 장비 사양과 외형 추가 · 획득처는 추후 지정</p><div class="grid" id="items"></div></main><script type="module">
import * as D from './data.mjs?v=boss220-distinct-v2';
document.querySelector('#items').innerHTML=D.EQUIPMENT_CATALOG.filter(it=>it.level===220).map(it=>{const a=D.equipmentIdentity(it),r=D.gearStatRanges(it),m=D.gearStatMultiplier(it);return `<article><span class="gear-frame boss-relic relic-220"><img class="gear-icon" src="${a.art}" alt="${a.name}"></span><h3>${a.name}</h3><small>${a.common?'전 직업 공통':D.CLASSES.find(c=>c.id===it.classId).name} · ${a.tierName}</small><p>${Object.entries(r).map(([k,v])=>`${({attack:'공격력',stat:'주스탯',hp:'체력',defense:'방어력'})[k]} ${Math.floor(v.min*m).toLocaleString()}~${Math.floor(v.max*m).toLocaleString()}`).join('<br>')}</p></article>`}).join('');
</script></html>
