name: Verify BM3 consumables and auction AU2
on:
  push:
    branches: [fix/black-market-BM3-20260911]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bm3qa
          POSTGRES_USER: bm3qa
          POSTGRES_PASSWORD: isolated-only
        ports: ['55444:5432']
        options: >-
          --health-cmd "pg_isready -U bm3qa -d bm3qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate migration and merge only the validated auction presentation files
        run: |
          git fetch --no-tags --depth=1 origin 748c09996c87ef43315e9c2da6a6ca6d384aedce
          for p in auction.js auction.css test/auction-mobile-ui.test.mjs; do git show 748c09996c87ef43315e9c2da6a6ca6d384aedce:"$p" > "$p"; done
          npm install --prefix "$RUNNER_TEMP/bm3-cli" --no-audit --no-fund --no-save supabase@2.81.3
          "$RUNNER_TEMP/bm3-cli/node_modules/.bin/supabase" migration new --help
          "$RUNNER_TEMP/bm3-cli/node_modules/.bin/supabase" migration new black_market_consumables_bm3
          python3 maintenance/build-bm3.py
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --prefix "$RUNNER_TEMP/bm3-pg" --ignore-scripts --no-audit --no-fund --no-save pg@8.16.3
          command -v google-chrome
      - name: Existing regressions and BM3 SQL purchase tests
        run: |
          node --check black-market.js
          node --check auction.js
          node --test test/economy.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs test/tower-hp-restored.test.mjs test/auction-db.test.mjs test/black-market-db.test.mjs
          node test/black-market-bm3.test.mjs
      - name: Real independent-connection PostgreSQL receipt and stock races
        env:
          BM3_QA_PG_URL: postgresql://bm3qa:isolated-only@127.0.0.1:55444/bm3qa
        run: QA_PG_MODULE="$RUNNER_TEMP/bm3-pg/node_modules/pg/esm/index.mjs" node test/black-market-bm3.test.mjs
      - name: Real browser mobile purchases and auction scrolling
        run: |
          QA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node test/black-market-bm3-browser.test.mjs
          QA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node test/auction-mobile-ui.test.mjs
      - name: Commit only validated changes to the isolated branch
        run: |
          test "$(git branch --show-current)" = 'fix/black-market-BM3-20260911'
          git rm -- .github/workflows/bm3-release-check.yml maintenance/build-bm3.py
          git add -- auction.js auction.css black-market.js black-market.css index.html BLACK-MARKET-ROLLOUT.md test/auction-mobile-ui.test.mjs test/black-market-bm3-browser.test.mjs supabase/migrations/*_black_market_consumables_bm3.sql
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: black-market materials and updated odds; release auction mobile stats UI'
          git push origin HEAD:refs/heads/fix/black-market-BM3-20260911
          git rev-parse HEAD
          sha256sum black-market.js black-market.css auction.js auction.css index.html supabase/migrations/*_black_market_consumables_bm3.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BM3-AU2-QA
          path: |
            test-output/BM3/
            test-output/auction-AU2/
          retention-days: 1
