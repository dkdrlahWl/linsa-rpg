name: Validate black-market BM2 prices
on:
  push:
    branches: [fix/black-market-BM2-20260910]
    paths: [.github/workflows/black-market-bm2.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested price and label edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          patches=json.loads(r'''{
          "black-market.js":{"before":"cada835f090e5a3ca502d1f014e1074e33011323","after":"a0f21e67586f839da7b27aa27c942b49f0ac3430","changes":[["/* LINSA BM1.","/* LINSA BM2."],["[5,15,30,50]","[5,15,50,100]"],["소환 9레벨 진열 확률","등급별 진열 확률"],["암시장 BM1</small>","암시장 BM2</small>"],["version:'BM1'","version:'BM2'"]]},
          "index.html":{"before":"e4f20cddc0d9440595e9edbd3e43a2bf1d3b9542","after":"4122f755b34fbcb69c02b09a94d71f92983ea53d","changes":[["2026-09-10-linsa-black-market-BM1","2026-09-10-linsa-black-market-BM2"],["black-market.js?v=BM1","black-market.js?v=BM2"]]},
          "black-market.sql.in":{"before":"8d0521cb38ee1eeb3976fe6e2cf5a623e1e0b940","after":"f095f6b9fca2dcf356201dbe666601451be6b0c1","changes":[["BLACK MARKET BM1","BLACK MARKET BM2"],["price in (5,15,30,50)","price in (5,15,50,100)"],["array[5,15,30,50]","array[5,15,50,100]"],["'version','BM1'","'version','BM2'"],["'BM1 installed:","'BM2 installed:"]]},
          "test/black-market-db.test.mjs":{"before":"1382dcc715e77536d1316dbdcd1d81408eb48746","after":"1da40dc18846ede1ef135e05a2510eed70497cc2","changes":[["[5,15,30,50]","[5,15,50,100]"],["  await db.exec('rollback');\n }\n const x=await call();","  const prior=await state(A);\n  await call('buy',x.rotation,0,randomUUID());\n  same((await state(A)).essence,prior.essence-[5,15,50,100][r],'actual rarity debit');\n  await reject(call('buy',x.rotation,0,randomUUID()),/BLACK_MARKET_PURCHASED/);\n  await db.exec('rollback');\n }\n const x=await call();"],["PASS BM1 PostgreSQL","PASS BM2 PostgreSQL"]]},
          "BLACK-MARKET-ROLLOUT.md":{"before":"baa478423b54f75bbabd5ee47b2b1123c3d43068","after":"ab3dabd92f12d52f2216ff747880388f5df657ad","changes":[["5/15/30/50","5/15/50/100"],["하단에 `암시장 BM1`","하단에 `암시장 BM2`"]],"append":"\n## BM2 가격·표시 변경\n\n2026-09-10 요청: 확률 패널 제목을 `등급별 진열 확률`로 변경합니다. 레어 50정수, 에픽 100정수이며 일반 5·희귀 15정수 및 추첨 확률은 유지합니다. 화면과 서버 구매 가격·검증 규칙을 함께 변경합니다. 서버 적용 여부는 별도 설치 검증 결과를 확인해야 합니다.\n"}
          }''')
          for name,p in patches.items():
              path=Path(name);data=path.read_bytes()
              assert blob(data)==p['before'], 'Source changed: '+name
              text=data.decode('utf-8')
              for before,after in p['changes']:
                  assert text.count(before)==1, 'Ambiguous anchor: '+name
                  text=text.replace(before,after,1)
              text+=p.get('append','')
              result=text.encode('utf-8')
              assert blob(result)==p['after'], 'Not the browser-tested output: '+name
              path.write_bytes(result)
          print('PASS exact BM2 output hashes; existing artwork unchanged')
          PY
          node scripts/build-black-market.mjs
          test "$(git hash-object supabase/17-black-market.sql)" = aff183167f1ab2ac153d60e8d19043a6142e0092
          node --check black-market.js
      - name: Install isolated test database engine
        run: npm install --prefix "$RUNNER_TEMP/bm2-qa" --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.5.8
      - name: Test actual rarity debit and one-purchase limits in temporary database
        run: QA_PGLITE_MODULE="$RUNNER_TEMP/bm2-qa/node_modules/@electric-sql/pglite/dist/index.js" node test/black-market-db.test.mjs
      - name: Run existing isolated regressions
        run: node --test test/economy.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs
      - name: Commit only verified edits and remove temporary workflow
        run: |
          git rm -- .github/workflows/black-market-bm2.yml
          git add -- index.html black-market.js black-market.sql.in supabase/17-black-market.sql test/black-market-db.test.mjs BLACK-MARKET-ROLLOUT.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: update black-market rare/epic prices and remove summon-level label'
          git push origin HEAD:refs/heads/fix/black-market-BM2-20260910
