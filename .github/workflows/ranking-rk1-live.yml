name: Verify deployed ranking UI RK1
on:
  push:
    branches: [fix/ranking-RK1-20260911]
    paths: [.github/workflows/ranking-rk1-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Match existing game site assets to tested immutable release
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const raw='https://raw.githubusercontent.com/dkdrlahWl/linsa-rpg/50397f0f2368b55494756ffd3867de33c3b489bb/';
          const site='https://dkdrlahwl.github.io/linsa-rpg/';
          const deadline=Date.now()+240000;
          for(const [file,query] of [['index.html',''],['ranking-ui.js','?v=ranking-RK1'],['ranking-ui.css','?v=ranking-RK1']]){
           const source=await fetch(raw+file,{signal:AbortSignal.timeout(15000)});assert.equal(source.status,200,file);const expected=hash(Buffer.from(await source.arrayBuffer()));
           let actual,status;
           do{
            const response=await fetch(site+file+query,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});status=response.status;actual=hash(Buffer.from(await response.arrayBuffer()));
            if(status===200&&actual===expected)break;
            if(Date.now()<deadline)await new Promise(resolve=>setTimeout(resolve,5000));
           }while(Date.now()<deadline);
           assert.equal(status,200,file);assert.equal(actual,expected,file);console.log('PASS deployed RK1 asset',file,actual);
          }
          const background=await fetch(site+'art/citadel-stage-v1.webp',{signal:AbortSignal.timeout(15000)});assert.equal(background.status,200);assert.ok(background.headers.get('content-type').startsWith('image/'));console.log('PASS existing decorative background available');
          console.log('PASS existing game address serves the exact tested attack-power and tower ranking UI. No player credentials, accounts, scores or transactions changed.');
          JS
