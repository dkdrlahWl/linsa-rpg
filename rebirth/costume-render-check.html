<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>코스튬 던전 표시 확인</title><style>body{background:#15202c;color:white;font:16px system-ui;margin:20px}canvas{display:block;width:100%;max-width:1200px;background:#354457;border:1px solid #aaa;margin-bottom:20px}h2{font-size:18px}</style><h1>코스튬 던전 표시 확인</h1><p id="status">확인 중</p><main></main><script type="module">import {TowerRenderer,image} from './tower-renderer.mjs?v=walk-two-legs-127';import {COSTUMES} from './costumes.mjs?v=costume-shop-105';let count=0;for(const c of COSTUMES){await image(c.portrait).decode();const h=document.createElement('h2');h.textContent=c.name+' · 8방향 이동/공격';document.querySelector('main').append(h);const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=270;document.querySelector('main').append(canvas);const g=canvas.getContext('2d');const r=Object.create(TowerRenderer.prototype);r.g=g;r.mobileActors={matches:true};for(let dir=0;dir<8;dir++){r.actor(c.classId,dir,true,dir%2===1,.5,2,100+dir*200,240,1,c.id);const pixels=g.getImageData(dir*200,0,200,270).data;let visible=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i]>0)visible++;if(visible<1000)throw Error(c.name+' invisible');count++;}}document.querySelector('#status').textContent='PASS · '+count+'개 방향 모두 캐릭터 표시됨';</script>
