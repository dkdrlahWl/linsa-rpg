<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="color-scheme" content="dark">
<meta name="ringu-build" content="2026-09-09-clean-1">
<title>링구 RPG · CLEAN</title>
<link rel="stylesheet" href="/linsa-rpg/clean-app.css?v=20260909-clean-1">
<style>@media(max-width:850px){.desktop-side{display:grid!important;margin-top:14px}}</style>
<script src="/linsa-rpg/cloud-config.js?v=20260909-clean-1"></script>
<script src="/linsa-rpg/cloud-adapter.js?v=20260909-clean-1"></script>
<script src="/linsa-rpg/safety.js?v=20260909-clean-1"></script>
<script defer src="/linsa-rpg/art-catalog.js?v=20260909-clean-1"></script>
<script defer src="/linsa-rpg/clean-app.js?v=20260909-clean-1"></script>
</head>
<body>
<div class="loading" id="loading"><section class="loading-card"><span class="kicker">RINGU RPG</span><h1>링구</h1><div class="spinner"></div><p>계정의 모험 기록을 불러오는 중입니다.<br>이 화면은 새 런타임에서 직접 시작됩니다.</p><div class="error-box" id="bootError"></div></section></div>
<div class="toast-zone" id="toasts"></div>
<div class="shell hidden" id="app">
<header class="top">
 <div class="brandline"><div class="brand"><b>링구</b><small>RPG · CLEAN</small></div><div class="account"><i class="status-dot"></i><span id="accountName">계정 연결됨</span></div></div>
 <div class="currency"><div class="g"><span>보유 골드</span><b id="gold">0</b></div><div class="e"><span>정수</span><b id="essence">0</b></div><div class="s"><span>초월석</span><b id="stone">0</b></div><div class="p"><span>공격력</span><b id="power">0</b></div></div>
</header>
<main class="content">
 <div class="stack">
  <section class="panel mobile-on" data-page="hunt">
   <div class="panel-head"><h2>모험 / 사냥</h2><small>15초 자동 전투</small></div>
   <div class="body">
    <div class="region-tabs" id="regionTabs"></div><div class="boss-list" id="bossList"></div>
    <div class="arena"><span class="world-name" id="worldName">초원</span><div class="monster-stage"><div class="monster-fallback" id="monsterOrb"><i></i></div></div><div class="battle-info"><div class="battle-title"><b id="bossTitle">보스</b><span id="hpText">0 / 0</span></div><div class="hp"><i id="hpFill"></i></div><div class="time"><i id="timeFill"></i></div><div class="battle-actions"><button class="btn primary" id="autoBtn" data-act="auto">자동사냥 ON</button><button class="btn" data-act="daily">일일 보상</button></div><div class="log" id="battleLog"></div></div></div>
   </div>
  </section>
  <section class="panel" data-page="character">
   <div class="panel-head"><h2>캐릭터 / 장비</h2><button class="btn" data-act="profile">프로필</button></div>
   <div class="body"><div class="equip-stage"><div class="hero"><canvas id="heroCanvas" width="420" height="560"></canvas><b>장착 장비 · 오라</b></div><div class="equip-grid" id="equipGrid"></div></div><div class="stats-grid" id="statGrid"></div></div>
  </section>
  <section class="panel" data-page="summon">
   <div class="panel-head"><h2>장비 소환</h2><small>소환 레벨에 따라 등급 확률 상승</small></div>
   <div class="body summon-box"><div class="seg" id="summonTabs"></div><div id="summonInfo"></div><div class="progress"><i id="summonBar"></i></div><div class="summon-actions" id="summonActions"></div></div>
  </section>
  <section class="panel" data-page="inventory">
   <div class="panel-head"><h2>인벤토리</h2><button class="btn" data-act="equip-best">최적 장착</button></div>
   <div class="body"><div class="inventory-tools"><select id="rarityFilter"><option value="all">전체 등급</option><option value="6">타락</option><option value="5">신화</option><option value="4">전설</option><option value="3">에픽</option><option value="2">레어</option><option value="1">희귀</option><option value="0">일반</option></select></div><div class="inventory-list" id="inventoryList"></div></div>
  </section>
 </div>
 <aside class="stack desktop-side">
  <section class="panel"><div class="panel-head"><h3>모험 메뉴</h3></div><div class="body side-nav"><button data-act="tower-open">🏰 시련의 탑</button><button data-act="dungeon-open">🌀 특수 던전</button><button data-act="shop">🛒 상점</button><button data-act="ranking">🏆 랭킹</button><button data-act="mail">📬 우편함</button><button data-act="settings">⚙ 설정</button></div></section>
  <section class="panel"><div class="panel-head"><h3>펫 / 동료</h3><small>펫 스톤 <b id="petStoneText">0</b></small></div><div class="body"><div class="pet-list" id="petList"></div></div></section>
 </aside>
</main>
</div>
<nav class="bottom-nav"><button class="on" data-page="hunt"><span>⚔️</span>사냥</button><button data-page="character"><span>🧙</span>캐릭터</button><button data-page="summon"><span>🔮</span>소환</button><button data-page="inventory"><span>🎒</span>장비</button><button data-page="hunt" data-act="settings"><span>🧭</span>메뉴</button></nav>
<div class="modal-wrap" id="modalWrap"><section class="modal"><button class="btn close" id="modalClose">닫기</button><h3 id="modalTitle">메뉴</h3><div id="modalBody"></div></section></div>
</body>
</html>
