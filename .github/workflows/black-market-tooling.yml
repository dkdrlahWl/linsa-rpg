name: Prepare isolated black-market QA
on:
  push:
    branches: [feature/black-market-BM1-20260910]
    paths: [.github/workflows/black-market-tooling.yml]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package pinned isolated PostgreSQL test engine; no production access
        run: |
          mkdir -p qa
          cd qa
          npm install --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.5.8
          tar -czf ../black-market-qa-tooling.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: black-market-qa-tooling
          path: black-market-qa-tooling.tar.gz
          retention-days: 1
