<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선계 코스튬 12종</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1523;color:#f0e8d6;font:14px system-ui}header{padding:24px;max-width:1400px;margin:auto}h1{font-size:27px;margin:4px 0 12px}p{color:#adbacb;line-height:1.6}button{background:#1d3147;color:#f3ddaa;border:1px solid #6b7181;border-radius:7px;padding:9px 14px;margin:3px}button.on{background:#645235}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:16px;max-width:1400px;margin:auto}article{border:1px solid #48576c;border-radius:14px;overflow:hidden;background:linear-gradient(#1f2c40,#101c2c);text-align:center}article img{width:100%;height:260px;object-fit:contain;padding:12px}canvas{width:100%;height:230px;background:#152237}h2{font-size:18px;margin:12px 0 5px}small{color:#bdcadc}strong{display:block;color:#ebce85;padding:12px}#status{color:#9bd6c1}</style>
<header><small>링구 RPG · 선계 컬렉션</small><h1>중국 판타지 코스튬 12종</h1><p>직업별 2종 · 개당 50,000,000 골드 · 보유 효과 공격력 +1%<br>기존 전투 렌더러와 크기 규칙으로 대기·양발 걷기·공격을 재생합니다.</p><div id="modes"><button data-mode="idle">대기</button><button data-mode="walk" class="on">걷기</button><button data-mode="attack">공격</button></div><button id="turn">방향 전환</button><span id="status">이미지 확인 중</span></header><main></main>
<script type="module">
import {COSTUMES} from './costumes.mjs?v=costume50m-fantasy-20261029';
import {TowerRenderer,image} from './tower-renderer.mjs?v=costume50m-fantasy-20261029';
const names={warrior:'전사',mage:'마법사',archer:'궁수',rogue:'도적',pirate:'해적',priest:'사제'};
const list=COSTUMES.filter(c=>c.price===50000000),actors=[];let mode='walk',dir=1;
for(const c of list){const card=document.createElement('article');card.innerHTML=`<h2>${c.name}</h2><small>${names[c.classId]} 전용</small><img src="${c.portrait}" alt="${c.name}"><canvas width="560" height="460"></canvas><strong>50,000,000 G</strong>`;document.querySelector('main').append(card);const canvas=card.querySelector('canvas'),r=Object.create(TowerRenderer.prototype);r.g=canvas.getContext('2d');r.mobileActors={matches:false};actors.push({c,canvas,r});}
await Promise.all(list.flatMap(c=>[image(c.atlas).decode(),image(c.portrait).decode()]));document.querySelector('#status').textContent='12종 이미지 로딩 완료';
document.querySelector('#modes').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;for(const b of document.querySelectorAll('[data-mode]'))b.classList.toggle('on',b.dataset.mode===mode);};document.querySelector('#turn').onclick=()=>dir=(dir+1)%8;
function draw(t){for(const {c,canvas,r}of actors){r.g.clearRect(0,0,canvas.width,canvas.height);r.actor(c.classId,dir,mode==='walk',mode==='attack',(t%850)/1000,t/110,280,405,1,c.id);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
