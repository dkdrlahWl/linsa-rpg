name: Final ranking RK1 visual check
on:
  push:
    branches: [fix/ranking-RK1-20260911]
    paths: [.github/workflows/ranking-rk1-final.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Keep the custom tab icons single and verify it in the real page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ranking-ui.css');p.write_text(p.read_text()+'\n/* RK1 already provides accessible decorative SVG icons for both tabs. */\n#profileModal.rk-ready .ranking-tabs>button[data-ui-icon]::before{content:none!important;display:none!important}\n')
          p=Path('test/ranking-ui.test.mjs');s=p.read_text();anchor=" assert.equal(await page.locator('#rankingTitle').textContent(),'전체 공격력 랭킹');";assert s.count(anchor)==1
          s=s.replace(anchor," assert.equal(await page.locator('#towerRankTab').evaluate(el=>getComputedStyle(el,'::before').content),'none');\n"+anchor,1);p.write_text(s)
          PY
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          sudo timeout 60s apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify both real ranking tabs and existing game behavior
        run: |
          node --check ranking-ui.js
          node --test test/economy.test.mjs test/tower-hp-restored.test.mjs test/costume-catalog.test.cjs test/pet-stack-model.test.cjs test/login-inventory.test.mjs test/login-recovery.test.mjs
          QA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node test/ranking-ui.test.mjs
      - name: Commit validated visual fix on isolated branch only
        run: |
          test "$(git branch --show-current)" = 'fix/ranking-RK1-20260911'
          git rm -- .github/workflows/ranking-rk1-final.yml
          git add -- ranking-ui.css test/ranking-ui.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: remove duplicate tower tab decoration in the verified ranking UI'
          git push origin HEAD:refs/heads/fix/ranking-RK1-20260911
          git rev-parse HEAD
          sha256sum index.html ranking-ui.js ranking-ui.css
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ranking-RK1-final
          path: test-output/ranking-RK1/
          retention-days: 1
